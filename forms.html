<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVPSAS - Forms</title>
<link rel="icon" href="https://wxyzofficial.sirv.com/SSU/ssu.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- PDF export (same CDN family used across the site) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --light-blue:#DCEEFF; --primary:#4A90E2; --dark-blue:#173B63;
  --accent:#FFD54F; --soft-yellow:#FFF4BF; --white:#FFFFFF;
  --bg:#F5F9FE; --text:#243447; --text2:#64748B;
  --border:#DCE5EF; --success:#198754; --error:#DC3545;
  --shadow:0 4px 16px rgba(23,59,99,.08);
  --shadow-lg:0 12px 32px rgba(23,59,99,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 0}
.topbar .container{max-width:820px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--dark-blue)}
.brand img{width:36px;height:36px;border-radius:50%;border:2px solid var(--light-blue)}
.brand small{display:block;font-weight:500;font-size:.7rem;color:var(--text2)}
.topbar .home-link{font-size:.85rem;color:var(--text2);padding:8px 14px;border-radius:8px;transition:.2s}
.topbar .home-link:hover{background:var(--light-blue);color:var(--dark-blue)}
main{flex:1;padding:34px 20px 60px}
.container{max-width:760px;margin:0 auto}

/* Form Card */
.form-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--border);margin-bottom:20px}
.form-header{padding:34px 36px 26px;border-bottom:1px solid var(--border);position:relative}
.form-header .accent-bar{position:absolute;top:0;left:0;right:0;height:6px;background:var(--primary)}

/* Title & Description Paragraph Handling */
.form-header h1{font-size:1.65rem;font-weight:800;color:var(--dark-blue);letter-spacing:-.02em;margin-bottom:10px;line-height:1.3}
.form-header h1 p{margin:0 0 6px;}
.form-header h1 p:last-child{margin-bottom:0;}
.form-header h1 b, .form-header h1 strong {font-weight:800}
.form-header h1 i, .form-header h1 em {font-style:italic}
.form-header h1 u {text-decoration:underline}

.form-header .desc{font-size:.96rem;color:var(--text2);line-height:1.6}
.form-header .desc p{margin:0 0 8px}
.form-header .desc p:last-child{margin-bottom:0}
.form-header .desc b, .form-header .desc strong {font-weight:700; color:var(--dark-blue)}
.form-header .desc i, .form-header .desc em {font-style:italic}
.form-header .desc u {text-decoration:underline}

.form-header .header-img{margin-top:18px;border-radius:12px;overflow:hidden;max-height:280px}
.form-header .header-img img{width:100%;height:100%;object-fit:cover;display:block}

/* Sections */
.section-block{display:none}
.section-block.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section-header{padding:24px 36px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#f8fbff,#fff)}

/* Section Title & Description Paragraph Handling */
.section-header h2{font-size:1.15rem;font-weight:700;color:var(--dark-blue);margin-bottom:6px;line-height:1.4}
.section-header h2 p{margin:0 0 6px;}
.section-header h2 p:last-child{margin-bottom:0;}
.section-header h2 b, .section-header h2 strong {font-weight:800}
.section-header h2 i, .section-header h2 em {font-style:italic}
.section-header h2 u {text-decoration:underline}

.section-header .s-desc{font-size:.9rem;color:var(--text2);line-height:1.6}
.section-header .s-desc p{margin:0 0 6px}
.section-header .s-desc p:last-child{margin-bottom:0}
.section-header .s-desc b, .section-header .s-desc strong {font-weight:700; color:var(--dark-blue)}
.section-header .s-desc i, .section-header .s-desc em {font-style:italic}
.section-header .s-desc u {text-decoration:underline}

.form-body{padding:24px 36px 34px}

/* Questions */
.question{padding:22px 0;border-bottom:1px solid var(--border);position:relative}
.question:last-of-type{border-bottom:none}

/* Question Title & Description Paragraph Handling */
.q-title{font-size:1rem;font-weight:600;color:var(--dark-blue);margin-bottom:5px;line-height:1.5}
.q-title p{margin:0 0 4px;}
.q-title p:last-child{margin-bottom:0;}
.q-title b, .q-title strong {font-weight:800}
.q-title i, .q-title em {font-style:italic}
.q-title u {text-decoration:underline}
.q-title .req{color:var(--error);margin-left:4px}

.q-desc{font-size:.85rem;color:var(--text2);margin-bottom:12px;line-height:1.5}
.q-desc p{margin:0 0 6px}
.q-desc p:last-child{margin-bottom:0}
.q-desc b, .q-desc strong {font-weight:700; color:var(--dark-blue)}
.q-desc i, .q-desc em {font-style:italic}
.q-desc u {text-decoration:underline}

.q-error{color:var(--error);font-size:.82rem;margin-top:7px;display:none;align-items:center;gap:6px}
.q-error.show{display:flex}

/* Inputs */
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=time],textarea,select{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.15)}
textarea{resize:vertical;min-height:100px;line-height:1.5}
.choice{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.2s;font-size:.94rem}
.choice:hover{border-color:var(--primary);background:var(--bg)}
.choice input{margin-top:3px;accent-color:var(--primary);width:17px;height:17px;flex-shrink:0}
.choice:has(input:checked){border-color:var(--primary);background:var(--light-blue)}
.scale-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scale-label{font-size:.82rem;color:var(--text2);font-weight:500}
.scale-opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--text2);transition:.2s;min-width:52px}
.scale-opt:hover{border-color:var(--primary);color:var(--primary)}
.scale-opt input{display:none}
.scale-opt:has(input:checked){border-color:var(--primary);background:var(--light-blue);color:var(--primary)}

/* Navigation & Submit */
.nav-wrap{padding:24px 36px;border-top:1px solid var(--border);background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 24px;border-radius:10px;font-weight:600;font-size:.95rem;transition:.2s}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(74,144,226,.3)}
.btn-primary:hover:not(:disabled){background:#3a7bc8;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.7;cursor:not-allowed}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--dark-blue)}
.btn-ghost:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.btn-accent{background:var(--accent);color:var(--dark-blue);box-shadow:0 6px 16px rgba(255,213,79,.35)}
.btn-accent:hover:not(:disabled){background:#ffc91f;transform:translateY(-1px)}
.full-btn{width:100%}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.loading .spinner{display:block}
.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Success / Error States */
.state{background:#fff;border-radius:20px;padding:60px 40px;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border);max-width:520px;margin:0 auto}
.state .icon{width:80px;height:80px;border-radius:50%;background:var(--light-blue);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px}
.state.success .icon{background:#e3f5ea;color:var(--success)}
.state.error .icon{background:#fde8ea;color:var(--error)}
.state h2{font-size:1.35rem;color:var(--dark-blue);margin-bottom:10px}
.state p{color:var(--text2);font-size:.95rem;margin-bottom:22px;line-height:1.6}
.state .state-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:400}
.toast{background:#fff;border-left:4px solid var(--primary);border-radius:10px;box-shadow:var(--shadow-lg);padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:.9rem;min-width:260px;animation:slideIn .3s}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--error)}
.toast i{font-size:1.05rem}
.toast.success i{color:var(--success)}
.toast.error i{color:var(--error)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ---------- Review Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(23,59,99,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:500;padding:20px;
  animation:fade .2s;overflow-y:auto;
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:20px;max-width:680px;width:100%;max-height:90vh;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  animation:pop .25s;overflow:hidden;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{
  padding:20px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#f8fbff,#fff);
}
.modal-head .m-icon{
  width:44px;height:44px;border-radius:12px;background:var(--light-blue);
  color:var(--primary);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;flex-shrink:0;
}
.modal-head .m-title{flex:1;min-width:0}
.modal-head h3{font-size:1.05rem;color:var(--dark-blue);line-height:1.3}
.modal-head p{font-size:.82rem;color:var(--text2);margin-top:2px}
.modal-close{
  width:34px;height:34px;border-radius:8px;color:var(--text2);
  display:inline-flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:var(--bg);color:var(--dark-blue)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-foot{
  padding:14px 24px;border-top:1px solid var(--border);background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.modal-foot .foot-info{font-size:.8rem;color:var(--text2)}
.modal-foot .foot-btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

.review-summary{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
}
.review-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--light-blue);color:var(--dark-blue);
  padding:6px 12px;border-radius:99px;font-size:.78rem;font-weight:600;
}
.review-pill.success{background:#e3f5ea;color:var(--success)}
.review-pill.error{background:#fde8ea;color:var(--error)}

.review-section{
  border:1px solid var(--border);border-radius:14px;
  margin-bottom:14px;overflow:hidden;background:#fff;
}
.review-section .rs-head{
  padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.review-section .rs-head .rs-num{
  width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;
}
.review-section .rs-head .rs-title{
  flex:1;font-size:.9rem;font-weight:700;color:var(--dark-blue);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.review-section .rs-head .rs-edit{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  border-radius:8px;background:#fff;border:1px solid var(--border);
  font-size:.76rem;font-weight:600;color:var(--primary);
}
.review-section .rs-head .rs-edit:hover{border-color:var(--primary);background:var(--light-blue)}
.review-row{
  padding:11px 16px;border-bottom:1px dashed var(--border);
  display:flex;flex-direction:column;gap:4px;
}
.review-row:last-child{border-bottom:none}
.review-row .rr-q{
  font-size:.82rem;font-weight:600;color:var(--dark-blue);
  display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;
}
.review-row .rr-q .req{color:var(--error)}
.review-row .rr-a{
  font-size:.88rem;color:var(--text);white-space:pre-wrap;word-break:break-word;line-height:1.5;
}
.review-row .rr-a.empty{color:var(--text2);font-style:italic}
.review-row .rr-actions{
  margin-top:2px;
}
.review-row .rr-link{
  font-size:.76rem;color:var(--primary);font-weight:600;
  display:inline-flex;align-items:center;gap:5px;
}
.review-row .rr-link:hover{text-decoration:underline}

/* ---------- PDF loading pill ---------- */
.pdf-loading{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--dark-blue);color:#fff;padding:10px 20px;border-radius:99px;
  font-size:.85rem;display:none;align-items:center;gap:10px;
  box-shadow:var(--shadow-lg);z-index:600;
}
.pdf-loading.show{display:flex}
.pdf-loading .spinner{display:block;border-top-color:#fff;border-color:rgba(255,255,255,.4)}

@media(max-width:600px){
  .form-header{padding:26px 22px 20px}
  .section-header{padding:20px 22px}
  .form-body{padding:18px 22px 24px}
  .nav-wrap{padding:18px 22px}
  .form-header h1{font-size:1.35rem}
  .nav-wrap .btn{width:100%}
  .modal-foot{flex-direction:column;align-items:stretch}
  .modal-foot .foot-btns{width:100%;margin-left:0}
  .modal-foot .foot-btns .btn{flex:1}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="container">
    <a href="index.html" class="brand">
      <img src="https://wxyzofficial.sirv.com/SSU/ssu.jpg" alt="SSU">
      <span>OVPSAS Forms<small>Online Form</small></span>
    </a>
    <a href="index.html" class="home-link"><i class="fa-solid fa-house"></i> Home</a>
  </div>
</div>

<main>
  <div class="container" id="mainContainer">
    <div class="state">
      <div class="icon"><div style="width:34px;height:34px;border:3px solid var(--light-blue);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite"></div></div>
      <h2>Loading form…</h2>
      <p>Please wait while we fetch the form.</p>
    </div>
  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<!-- Review modal -->
<div class="modal-overlay" id="reviewOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
    <div class="modal-head">
      <div class="m-icon"><i class="fa-solid fa-list-check"></i></div>
      <div class="m-title">
        <h3 id="reviewTitle">Review Your Answers</h3>
        <p>Check your responses below. You can edit any section before submitting.</p>
      </div>
      <button class="modal-close" id="reviewCloseBtn" aria-label="Close review">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body" id="reviewBody"></div>
    <div class="modal-foot">
      <div class="foot-info" id="reviewFootInfo"></div>
      <div class="foot-btns">
        <button class="btn btn-ghost" id="reviewCancelBtn">
          <i class="fa-solid fa-pen"></i> Keep Editing
        </button>
        <button class="btn btn-primary" id="reviewSubmitBtn">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fa-solid fa-paper-plane"></i> Submit Response</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="pdf-loading" id="pdfLoading">
  <span class="spinner"></span> Generating PDF receipt…
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp, updateDoc, increment }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo5TKy65vg27n9Dkuh_PDnNT2byHndEY0",
  authDomain: "forms-a9b1c.firebaseapp.com",
  projectId: "forms-a9b1c",
  storageBucket: "forms-a9b1c.firebasestorage.app",
  messagingSenderId: "1076879732619",
  appId: "1:1076879732619:web:89ba4135332ac30805898e",
  measurementId: "G-88TF54KBKR"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const main = $('#mainContainer');
let formData = null;
let formId = null;
let anonUser = null;
let currentSectionIndex = 0;
let navigationHistory = [];
let pendingAnswers = null;   // snapshot of answers taken when review opens
let lastSubmission = null;   // { answers, responseId, submittedAt }
let submitting = false;

/* The SSU + CHED logos are raster images on a third-party CDN. For the PDF
   receipt we fetch them once and cache them as data URLs so jsPDF can embed
   them without CORS retries. Failure is silent — the receipt still renders. */
const PDF_LOGOS = {
  ssu: { url:'https://wxyzofficial.sirv.com/SSU/ssu.jpg',  data:null },
  ched:{ url:'https://wxyzofficial.sirv.com/SSU/ched.png', data:null }
};
async function loadPdfLogos(){
  for (const key of Object.keys(PDF_LOGOS)){
    const L = PDF_LOGOS[key];
    if (L.data) continue;
    try {
      const res = await fetch(L.url, { mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      L.data = await blobToDataURL(blob);
    } catch (err){
      console.warn('Logo fetch failed for PDF:', key, err.message);
    }
  }
}
function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':'fa-circle-exclamation'}"></i><span></span>`;
  el.querySelector('span').textContent = msg;
  $('#toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function showState(type, icon, title, msg, actionHtml=''){
  const klass = type === 'success' ? 'state success' : type === 'error' ? 'state error' : 'state';
  main.innerHTML = `<div class="${klass}">
    <div class="icon"><i class="fa-solid ${icon}"></i></div>
    <h2>${escapeHtml(title)}</h2>
    <p>${escapeHtml(msg)}</p>
    <div class="state-actions">${actionHtml}</div>
  </div>`;
}

/* --- URL id --- */
const params = new URLSearchParams(window.location.search);
formId = params.get('id');
if (!formId){
  showState('error','fa-triangle-exclamation','No Form Specified','The form link is missing an ID. Please check the URL and try again.',
    `<a class="btn btn-primary" href="index.html"><i class="fa-solid fa-house"></i> Go to Homepage</a>`);
}

/* --- Auth --- */
onAuthStateChanged(auth, async (user) => {
  if (!user){
    try { const cred = await signInAnonymously(auth); anonUser = cred.user; }
    catch(e){ console.error(e); if (formId) showState('error','fa-triangle-exclamation','Authentication Error','We could not establish a session. Please refresh and try again.'); return; }
  } else { anonUser = user; }
  if (formId) loadForm();
});

/* --- Load form --- */
async function loadForm(){
  try {
    const ref = doc(db, 'forms', formId);
    const snap = await getDoc(ref);
    if (!snap.exists()){
      showState('error','fa-file-circle-xmark','Form Not Found','The form you are looking for does not exist or has been removed.',
        `<a class="btn btn-primary" href="index.html"><i class="fa-solid fa-house"></i> Go to Homepage</a>`);
      return;
    }
    formData = { id:snap.id, ...snap.data() };

    if (formData.status !== 'published'){
      showState('error','fa-lock','Form Unavailable','This form is not currently published and cannot accept responses.',
        `<a class="btn btn-primary" href="index.html"><i class="fa-solid fa-house"></i> Go to Homepage</a>`);
      return;
    }
    const s = formData.settings || {};
    if (s.acceptingResponses === false){
      showState('error','fa-door-closed','Form Closed','This form is no longer accepting responses.',
        s.closingMessage ? `<p>${escapeHtml(s.closingMessage)}</p>` : '');
      return;
    }
    if (s.deadline && new Date(s.deadline) < new Date()){
      showState('error','fa-clock','Deadline Passed','The submission deadline for this form has passed.',
        s.closingMessage ? `<p>${escapeHtml(s.closingMessage)}</p>` : '');
      return;
    }
    renderForm();
  } catch(e){
    console.error(e);
    showState('error','fa-triangle-exclamation','Connection Error','We could not load the form. Please check your connection and refresh the page.');
  }
}

/* --- Sections --- */
function getSections(){
  if (Array.isArray(formData.sections) && formData.sections.length) {
    return formData.sections;
  }
  return [{ id: 'sec_1', title: 'Form Questions', titleHtml: '', description: '', descriptionHtml: '', questions: formData.questions || [] }];
}

/* --- Render form --- */
function renderForm(){
  const s = formData.settings || {};
  const theme = s.themeColor || '#4A90E2';
  const sections = getSections();

  const targetSections = {};
  sections.forEach((sec) => {
    (sec.questions || []).forEach((q) => {
      if (q.branching && Object.keys(q.branching).length > 0) {
        Object.values(q.branching).forEach((targetId) => { targetSections[targetId] = true; });
      }
    });
  });

  let startIndex = sections.findIndex(sec => !targetSections[sec.id]);
  if (startIndex === -1) startIndex = 0;

  currentSectionIndex = startIndex;
  navigationHistory = [startIndex];

  const headerImg = s.headerImage ? `<div class="header-img"><img src="${escapeHtml(s.headerImage)}" alt="Header"></div>` : '';
  const titleHtml = formData.titleHtml || escapeHtml(formData.title||'Untitled Form');
  const descHtml = formData.descriptionHtml || (formData.description ? escapeHtml(formData.description) : '');

  let html = `<div class="form-card">
    <div class="form-header">
      <div class="accent-bar" style="background:${theme}"></div>
      <h1>${titleHtml}</h1>
      ${descHtml ? `<div class="desc">${descHtml}</div>` : ''}
      ${headerImg}
    </div>`;

  html += `<form id="responseForm" novalidate>`;

  sections.forEach((sec, si) => {
    const isActive = si === startIndex ? 'active' : '';
    const secTitleHtml = sec.titleHtml || escapeHtml(sec.title||'Section '+(si+1));
    const secDescHtml = sec.descriptionHtml || (sec.description ? escapeHtml(sec.description) : '');

    html += `<div class="section-block ${isActive}" data-section="${si}">`;
    if (sections.length > 1 || sec.titleHtml || sec.title || secDescHtml) {
      html += `<div class="section-header">
        <h2>${secTitleHtml}</h2>
        ${secDescHtml ? `<div class="s-desc">${secDescHtml}</div>` : ''}
      </div>`;
    }
    html += `<div class="form-body" id="secBody_${si}"></div>`;
    html += `</div>`;
  });

  html += `<div class="nav-wrap" id="navWrap">
    <button type="button" class="btn btn-ghost" id="backBtn" disabled>
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>
    <button type="button" class="btn btn-primary" id="nextBtn" style="background:${theme}">
      <span class="spinner"></span>
      <span class="btn-text">Next <i class="fa-solid fa-arrow-right"></i></span>
    </button>
  </div>`;

  html += `</form></div>`;
  main.innerHTML = html;

  sections.forEach((sec, si) => {
    const body = $(`#secBody_${si}`);
    (sec.questions || []).forEach((q, qi) => body.appendChild(renderQuestion(q, qi)));
  });

  $('#responseForm').addEventListener('submit', (e) => e.preventDefault()); // handled explicitly
  $('#backBtn').addEventListener('click', prevSection);
  $('#nextBtn').addEventListener('click', () => nextSection(currentSectionIndex));
  updateNavBar();
}

function updateNavBar(){
  const backBtn = $('#backBtn');
  const nextBtn = $('#nextBtn');
  if (!backBtn || !nextBtn) return;

  const hasPrevious = navigationHistory.length > 1;
  backBtn.disabled = !hasPrevious;
  backBtn.style.visibility = hasPrevious ? 'visible' : 'hidden';

  const nextSi = getNextSectionIndex(currentSectionIndex);
  if (nextSi === -1) {
    nextBtn.innerHTML = `<span class="spinner"></span>
      <span class="btn-text"><i class="fa-solid fa-list-check"></i> Review &amp; Submit</span>`;
  } else {
    nextBtn.innerHTML = `<span class="spinner"></span>
      <span class="btn-text">Next <i class="fa-solid fa-arrow-right"></i></span>`;
  }
}

/* --- Validation --- */
function validateSection(si){
  const secDiv = document.querySelector(`.section-block[data-section="${si}"]`);
  if (!secDiv) return { ok:true, firstError:null };
  const questions = secDiv.querySelectorAll('.question');
  let firstErr = null;
  let hasError = false;

  questions.forEach(qDiv => {
    const qid = qDiv.dataset.qid;
    const qtype = qDiv.dataset.qtype;
    const q = findQuestion(qid);
    const err = qDiv.querySelector('.q-error');
    err.classList.remove('show');
    let missing = false;
    let val = null;

    if (qtype === 'checkbox'){
      const checked = [...qDiv.querySelectorAll(`input[type=checkbox]:checked`)];
      if (q.required && checked.length === 0) missing = true;
    } else if (qtype === 'radio' || qtype === 'scale'){
      const sel = qDiv.querySelector(`input[type=radio]:checked`);
      if (!sel && q.required) missing = true;
    } else {
      const input = qDiv.querySelector('input,textarea,select');
      val = input ? input.value.trim() : '';
      if (q.required && !val) missing = true;
      if (val && qtype === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){
        missing = true; err.querySelector('span').textContent = 'Please enter a valid email address.';
      } else if (val && qtype === 'phone' && !/^[+0-9()\-\s]{7,20}$/.test(val)){
        missing = true; err.querySelector('span').textContent = 'Please enter a valid phone number.';
      } else if (!missing){
        err.querySelector('span').textContent = 'This field is required.';
      }
    }

    if (missing){
      hasError = true;
      err.classList.add('show');
      if (!firstErr) firstErr = qDiv;
    }
  });

  return { ok: !hasError, firstError: firstErr };
}

/* --- Branching --- */
function getNextSectionIndex(currentSi){
  const sections = getSections();
  const currentSec = sections[currentSi];
  let nextSi = -1;

  if (currentSec.questions && currentSec.questions.length) {
    for (const q of currentSec.questions) {
      if (q.branching && Object.keys(q.branching).length > 0) {
        const qDiv = document.querySelector(`.question[data-qid="${q.id}"]`);
        if (!qDiv) continue;
        let selectedValue = null;
        if (q.type === 'radio' || q.type === 'dropdown') {
          const sel = qDiv.querySelector(`input[type="radio"]:checked, select`);
          if (sel) selectedValue = sel.value;
        }
        if (selectedValue && q.branching[selectedValue]) {
          const targetSectionId = q.branching[selectedValue];
          const targetIndex = sections.findIndex(s => s.id === targetSectionId);
          if (targetIndex !== -1) { nextSi = targetIndex; break; }
        }
      }
    }
  }

  if (nextSi === -1) {
    const targetSections = {};
    sections.forEach(sec => {
      (sec.questions || []).forEach(q => {
        if (q.branching) Object.values(q.branching).forEach(id => targetSections[id] = true);
      });
    });
    for (let i = currentSi + 1; i < sections.length; i++) {
      if (!targetSections[sections[i].id]) { nextSi = i; break; }
    }
  }
  return nextSi;
}

function nextSection(currentSi){
  const v = validateSection(currentSi);
  if (!v.ok){
    v.firstError?.scrollIntoView({behavior:'smooth', block:'center'});
    toast('Please fix the highlighted fields before proceeding.', 'error');
    return;
  }

  const nextSi = getNextSectionIndex(currentSi);
  const blocks = document.querySelectorAll('.section-block');

  if (nextSi === -1) {
    openReviewModal();
    return;
  }

  blocks[currentSi].classList.remove('active');
  blocks[nextSi].classList.add('active');
  navigationHistory.push(nextSi);
  currentSectionIndex = nextSi;
  blocks[nextSi].scrollIntoView({ behavior: 'smooth', block: 'start' });
  updateNavBar();
}

function prevSection(){
  if (navigationHistory.length <= 1) return;
  navigationHistory.pop();
  const prevSi = navigationHistory[navigationHistory.length - 1];
  const blocks = document.querySelectorAll('.section-block');
  blocks[currentSectionIndex].classList.remove('active');
  blocks[prevSi].classList.add('active');
  currentSectionIndex = prevSi;
  blocks[prevSi].scrollIntoView({ behavior: 'smooth', block: 'start' });
  updateNavBar();
}

/* --- Question finder & renderer --- */
function findQuestion(qid){
  const sections = getSections();
  for (const sec of sections) {
    const q = (sec.questions || []).find(x => x.id === qid);
    if (q) return q;
  }
  return null;
}

function renderQuestion(q, i){
  const div = document.createElement('div');
  div.className = 'question';
  div.dataset.qid = q.id;
  div.dataset.qtype = q.type;

  const req = q.required ? '<span class="req">*</span>' : '';
  const titleHtml = q.titleHtml || escapeHtml(q.title||'Untitled');
  const descHtml = q.descriptionHtml || (q.description ? escapeHtml(q.description) : '');

  const head = document.createElement('div');
  head.innerHTML = `<div class="q-title">${i+1}. ${titleHtml} ${req}</div>
    ${descHtml ? `<div class="q-desc">${descHtml}</div>` : ''}`;
  div.appendChild(head);

  const ctrl = document.createElement('div');
  ctrl.className = 'q-control';
  let inputHtml = '';

  switch(q.type){
    case 'short': inputHtml = `<input type="text" name="${q.id}" placeholder="Your answer">`; break;
    case 'paragraph': inputHtml = `<textarea name="${q.id}" placeholder="Your answer"></textarea>`; break;
    case 'radio':
      inputHtml = (q.options||[]).map(o => `<label class="choice">
        <input type="radio" name="${q.id}" value="${escapeHtml(o)}">
        <span>${escapeHtml(o)}</span></label>`).join(''); break;
    case 'checkbox':
      inputHtml = (q.options||[]).map(o => `<label class="choice">
        <input type="checkbox" name="${q.id}" value="${escapeHtml(o)}">
        <span>${escapeHtml(o)}</span></label>`).join(''); break;
    case 'dropdown':
      inputHtml = `<select name="${q.id}">
        <option value="">Select an option</option>
        ${(q.options||[]).map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select>`; break;
    case 'date': inputHtml = `<input type="date" name="${q.id}">`; break;
    case 'time': inputHtml = `<input type="time" name="${q.id}">`; break;
    case 'number': inputHtml = `<input type="number" name="${q.id}" placeholder="Enter a number">`; break;
    case 'email': inputHtml = `<input type="email" name="${q.id}" placeholder="name@example.com">`; break;
    case 'phone': inputHtml = `<input type="tel" name="${q.id}" placeholder="+63 9xx xxx xxxx">`; break;
    case 'scale': {
      const nums = [];
      for (let n = q.scaleMin||1; n <= (q.scaleMax||5); n++) nums.push(n);
      inputHtml = `<div class="scale-row">
        ${q.scaleMinLabel?`<span class="scale-label">${escapeHtml(q.scaleMinLabel)}</span>`:''}
        ${nums.map(n => `<label class="scale-opt"><input type="radio" name="${q.id}" value="${n}">${n}</label>`).join('')}
        ${q.scaleMaxLabel?`<span class="scale-label">${escapeHtml(q.scaleMaxLabel)}</span>`:''}
      </div>`;
      break;
    }
  }
  ctrl.innerHTML = inputHtml;

  const err = document.createElement('div');
  err.className = 'q-error';
  err.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>This field is required.</span>`;
  div.appendChild(ctrl);
  div.appendChild(err);

  ctrl.querySelectorAll('input,textarea,select').forEach(el => {
    el.addEventListener('input', () => err.classList.remove('show'));
    el.addEventListener('change', () => err.classList.remove('show'));
  });
  return div;
}

/* --- Answer collection (only visited sections) --- */
function collectAnswers(visitedOnly = true){
  const answers = {};
  const sectionsToScan = visitedOnly ? navigationHistory : [...Array(getSections().length).keys()];
  sectionsToScan.forEach(si => {
    const secDiv = document.querySelector(`.section-block[data-section="${si}"]`);
    if (!secDiv) return;
    secDiv.querySelectorAll('.question').forEach(qDiv => {
      const qid = qDiv.dataset.qid;
      const qtype = qDiv.dataset.qtype;
      let val = null;
      if (qtype === 'checkbox'){
        val = [...qDiv.querySelectorAll(`input[type=checkbox]:checked`)].map(c => c.value);
      } else if (qtype === 'radio' || qtype === 'scale'){
        const sel = qDiv.querySelector(`input[type=radio]:checked`);
        if (sel) val = qtype === 'scale' ? Number(sel.value) : sel.value;
      } else {
        const input = qDiv.querySelector('input,textarea,select');
        val = input ? input.value.trim() : '';
      }
      answers[qid] = val;
    });
  });
  return answers;
}

/* ================================================================
   REVIEW MODAL
   ================================================================ */
function openReviewModal(){
  // Validate all visited sections first
  for (const si of navigationHistory){
    const v = validateSection(si);
    if (!v.ok){
      document.querySelectorAll('.section-block').forEach(b => b.classList.remove('active'));
      const target = document.querySelector(`.section-block[data-section="${si}"]`);
      target.classList.add('active');
      currentSectionIndex = si;
      updateNavBar();
      v.firstError?.scrollIntoView({behavior:'smooth', block:'center'});
      toast('Please complete the highlighted required fields.', 'error');
      return;
    }
  }

  pendingAnswers = collectAnswers(true);
  buildReviewBody();
  $('#reviewOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeReviewModal(){
  $('#reviewOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

function buildReviewBody(){
  const sections = getSections();
  const body = $('#reviewBody');
  body.innerHTML = '';

  // Summary pills
  let totalQ = 0, answeredQ = 0, requiredQ = 0, requiredAnswered = 0;
  sections.forEach((sec) => {
    if (!navigationHistory.includes(sections.indexOf(sec))) return;
    (sec.questions || []).forEach(q => {
      totalQ++;
      if (q.required) requiredQ++;
      const v = pendingAnswers[q.id];
      const filled = Array.isArray(v) ? v.length > 0 : (v !== '' && v !== null && v !== undefined);
      if (filled){ answeredQ++; if (q.required) requiredAnswered++; }
    });
  });

  const summary = document.createElement('div');
  summary.className = 'review-summary';
  summary.innerHTML = `
    <span class="review-pill"><i class="fa-solid fa-circle-question"></i> ${totalQ} question${totalQ!==1?'s':''}</span>
    <span class="review-pill success"><i class="fa-solid fa-circle-check"></i> ${answeredQ} answered</span>
    ${requiredQ ? `<span class="review-pill ${requiredAnswered===requiredQ?'success':'error'}">
      <i class="fa-solid fa-asterisk"></i> ${requiredAnswered}/${requiredQ} required
    </span>` : ''}
  `;
  body.appendChild(summary);

  // Sections that the user actually visited
  let displayIdx = 0;
  sections.forEach((sec, si) => {
    if (!navigationHistory.includes(si)) return;
    displayIdx++;

    const secEl = document.createElement('div');
    secEl.className = 'review-section';

    const head = document.createElement('div');
    head.className = 'rs-head';
    const secTitle = (sec.title || '').toString().trim() || `Section ${displayIdx}`;
    head.innerHTML = `
      <span class="rs-num">${displayIdx}</span>
      <span class="rs-title"></span>
      <button type="button" class="rs-edit" data-sec="${si}">
        <i class="fa-solid fa-pen"></i> Edit
      </button>
    `;
    head.querySelector('.rs-title').textContent = secTitle;
    head.querySelector('.rs-edit').addEventListener('click', () => {
      closeReviewModal();
      // Jump to that section
      document.querySelectorAll('.section-block').forEach(b => b.classList.remove('active'));
      const target = document.querySelector(`.section-block[data-section="${si}"]`);
      target.classList.add('active');
      currentSectionIndex = si;
      // Keep navigation history coherent
      if (!navigationHistory.includes(si)) navigationHistory.push(si);
      updateNavBar();
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    secEl.appendChild(head);

    (sec.questions || []).forEach((q) => {
      const row = document.createElement('div');
      row.className = 'review-row';
      const val = pendingAnswers[q.id];
      const display = formatAnswerForDisplay(val, q);
      const isEmpty = display === '';
      row.innerHTML = `
        <div class="rr-q">
          <span class="rr-q-text"></span>
          ${q.required ? '<span class="req">*</span>' : ''}
        </div>
        <div class="rr-a ${isEmpty ? 'empty' : ''}"></div>
        <div class="rr-actions">
          <a href="javascript:void(0)" class="rr-link" data-jump="${si}" data-qid="${q.id}">
            <i class="fa-solid fa-pen-to-square"></i> Edit this answer
          </a>
        </div>
      `;
      row.querySelector('.rr-q-text').textContent = q.title || 'Question';
      row.querySelector('.rr-a').textContent = isEmpty ? '(not answered)' : display;
      row.querySelector('.rr-link').addEventListener('click', () => {
        closeReviewModal();
        document.querySelectorAll('.section-block').forEach(b => b.classList.remove('active'));
        const target = document.querySelector(`.section-block[data-section="${si}"]`);
        target.classList.add('active');
        currentSectionIndex = si;
        if (!navigationHistory.includes(si)) navigationHistory.push(si);
        updateNavBar();
        // Scroll & focus this specific question
        const qDiv = target.querySelector(`.question[data-qid="${q.id}"]`);
        if (qDiv){
          qDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const inp = qDiv.querySelector('input,textarea,select');
          if (inp) setTimeout(() => inp.focus({ preventScroll: true }), 400);
        }
      });
      secEl.appendChild(row);
    });

    body.appendChild(secEl);
  });

  // Footer info
  $('#reviewFootInfo').textContent = requiredAnswered < requiredQ
    ? `${requiredQ - requiredAnswered} required question${requiredQ-requiredAnswered!==1?'s':''} still unanswered`
    : 'All required questions are answered.';
  $('#reviewSubmitBtn').disabled = requiredAnswered < requiredQ;
}

function formatAnswerForDisplay(v, q){
  if (v === null || v === undefined || v === '') return '';
  if (Array.isArray(v)) return v.filter(Boolean).join(', ');
  if (q && q.type === 'scale'){
    const n = Number(v);
    if (!isNaN(n)){
      const min = q.scaleMinLabel, max = q.scaleMaxLabel;
      const minN = q.scaleMin ?? 1, maxN = q.scaleMax ?? 5;
      if (min && n === minN) return `${n} (${min})`;
      if (max && n === maxN) return `${n} (${max})`;
    }
  }
  return String(v);
}

/* --- Review modal button wiring --- */
$('#reviewCloseBtn').addEventListener('click', closeReviewModal);
$('#reviewCancelBtn').addEventListener('click', closeReviewModal);
$('#reviewOverlay').addEventListener('click', (e) => {
  if (e.target === $('#reviewOverlay')) closeReviewModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#reviewOverlay').classList.contains('show')) closeReviewModal();
});

$('#reviewSubmitBtn').addEventListener('click', async () => {
  const btn = $('#reviewSubmitBtn');
  if (btn.disabled || submitting) return;
  await submitResponse(pendingAnswers, btn);
});

/* ================================================================
   SUBMIT
   ================================================================ */
async function submitResponse(answers, btnEl){
  if (submitting) return;

  if (!auth.currentUser){
    try { await signInAnonymously(auth); }
    catch { toast('Session error. Please refresh.', 'error'); return; }
  }

  submitting = true;
  const btn = btnEl || $('#reviewSubmitBtn');
  const origHTML = btn.innerHTML;
  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const fresh = await getDoc(doc(db, 'forms', formId));
    if (!fresh.exists() || fresh.data().status !== 'published' || fresh.data().settings?.acceptingResponses === false){
      toast('This form is no longer accepting responses.', 'error');
      btn.disabled = false; btn.classList.remove('loading');
      submitting = false;
      return;
    }

    const respCol = collection(db, 'forms', formId, 'responses');
    const docRef = await addDoc(respCol, {
      formId,
      answers,
      submittedAt: serverTimestamp(),
      respondentUid: auth.currentUser.uid,
      syncStatus: 'synced'
    });

    try {
      await updateDoc(doc(db, 'forms', formId), { responseCount: increment(1) });
    } catch(e){ console.warn('Count update failed:', e.message); }

    const submittedAt = new Date();
    lastSubmission = {
      answers: { ...answers },
      responseId: docRef.id,
      submittedAt
    };

    closeReviewModal();
    showSuccessScreen();
  } catch(e){
    console.error(e);
    toast('Could not submit response: ' + (e.message || 'Unknown error'), 'error');
    btn.disabled = false; btn.classList.remove('loading');
    submitting = false;
  }
}

/* ================================================================
   SUCCESS SCREEN
   ================================================================ */
function showSuccessScreen(){
  const s = formData.settings || {};
  const allowMultiple = s.allowMultiple !== false;
  const msg = s.confirmationMessage || 'Thank you! Your response has been recorded.';

  const actions = `
    <button class="btn btn-accent" id="downloadPdfBtn">
      <i class="fa-solid fa-file-pdf"></i> Download Response (PDF)
    </button>
    ${allowMultiple
      ? `<button class="btn btn-ghost" id="submitAnotherBtn">
           <i class="fa-solid fa-rotate"></i> Submit Another Response
         </button>`
      : ''}
  `;

  showState('success','fa-circle-check','Response Submitted', msg, actions);

  const pdfBtn = document.getElementById('downloadPdfBtn');
  if (pdfBtn) pdfBtn.addEventListener('click', () => downloadResponsePdf(pdfBtn));

  const anotherBtn = document.getElementById('submitAnotherBtn');
  if (anotherBtn){
    anotherBtn.addEventListener('click', () => {
      lastSubmission = null;
      submitting = false;
      // Reset form: go back to first entry section
      renderForm();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
}

/* ================================================================
   PDF RECEIPT
   ================================================================ */
async function downloadResponsePdf(btnEl){
  if (!lastSubmission){ toast('Nothing to download', 'error'); return; }

  const btn = btnEl || document.getElementById('downloadPdfBtn');
  const origHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating…`;
  $('#pdfLoading').classList.add('show');

  try {
    // Load logos (cached after first success)
    await loadPdfLogos();

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });

    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 40;

    /* -------- Header band -------- */
    doc.setFillColor(23, 59, 99); // dark blue
    doc.rect(0, 0, pageW, 96, 'F');
    // Accent stripe
    doc.setFillColor(255, 213, 79); // yellow
    doc.rect(0, 96, pageW, 6, 'F');

    // Logos
    let logoX = margin;
    const logoSize = 52;
    try {
      if (PDF_LOGOS.ssu.data)  doc.addImage(PDF_LOGOS.ssu.data,  'JPEG', logoX, 22, logoSize, logoSize);
      logoX += logoSize + 10;
      if (PDF_LOGOS.ched.data) doc.addImage(PDF_LOGOS.ched.data, 'PNG',  logoX, 22, logoSize, logoSize);
    } catch(err){ console.warn('Logo embed skipped:', err.message); }

    // Title block
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text('OVPSAS FORMS', pageW - margin, 34, { align: 'right' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('Official Response Receipt', pageW - margin, 48, { align: 'right' });
    doc.setFontSize(8);
    doc.setTextColor(200, 219, 240);
    doc.text(`Generated: ${new Date().toLocaleString('en-PH')}`, pageW - margin, 62, { align: 'right' });

    /* -------- Form title -------- */
    let y = 130;
    doc.setTextColor(23, 59, 99);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    const titleLines = doc.splitTextToSize(formData.title || 'Untitled Form', pageW - margin*2);
    doc.text(titleLines, margin, y);
    y += titleLines.length * 20 + 4;

    if (formData.description){
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      const descLines = doc.splitTextToSize(formData.description, pageW - margin*2);
      doc.text(descLines, margin, y);
      y += descLines.length * 13 + 8;
    }

    /* -------- Meta box -------- */
    y += 4;
    doc.setFillColor(245, 249, 254); // --bg
    doc.roundedRect(margin, y, pageW - margin*2, 64, 8, 8, 'F');
    doc.setTextColor(23, 59, 99);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('REFERENCE ID', margin + 14, y + 18);
    doc.text('SUBMITTED AT', margin + (pageW - margin*2)/2 + 4, y + 18);

    doc.setFont('courier', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(36, 52, 71);
    doc.text(lastSubmission.responseId, margin + 14, y + 36);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text(lastSubmission.submittedAt.toLocaleString('en-PH'), margin + (pageW - margin*2)/2 + 4, y + 36);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(23, 59, 99);
    doc.text('STATUS', margin + 14, y + 52);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(25, 135, 84);
    doc.text('Recorded successfully', margin + 14 + 52, y + 52);

    y += 84;

    /* -------- Answers table -------- */
    const rows = [];
    getSections().forEach((sec, si) => {
      if (!navigationHistory.includes(si)) return;
      (sec.questions || []).forEach((q) => {
        const v = lastSubmission.answers[q.id];
        const display = formatAnswerForDisplay(v, q);
        rows.push([
          q.title || 'Question',
          display || '(not answered)'
        ]);
      });
    });

    doc.autoTable({
      head: [['Question', 'Response']],
      body: rows,
      startY: y,
      margin: { left: margin, right: margin, top: 120, bottom: 60 },
      styles: {
        font: 'helvetica',
        fontSize: 9,
        cellPadding: 8,
        overflow: 'linebreak',
        lineColor: [220, 229, 239],
        lineWidth: 0.5,
        textColor: [36, 52, 71],
        valign: 'top'
      },
      headStyles: {
        fillColor: [74, 144, 226], // --primary
        textColor: 255,
        fontStyle: 'bold',
        fontSize: 10,
        halign: 'left'
      },
      alternateRowStyles: { fillColor: [245, 249, 254] },
      columnStyles: {
        0: { cellWidth: (pageW - margin*2) * 0.42, fontStyle: 'bold', textColor: [23, 59, 99] },
        1: { cellWidth: (pageW - margin*2) * 0.58 }
      },
      didDrawPage: (data) => {
        // Footer on every page
        const h = doc.internal.pageSize.getHeight();
        const pageNum = doc.internal.getNumberOfPages();

        doc.setDrawColor(220, 229, 239);
        doc.setLineWidth(0.5);
        doc.line(margin, h - 48, pageW - margin, h - 48);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(100, 116, 139);
        doc.text('This receipt was generated by OVPSAS Forms.', margin, h - 32);
        doc.text(`Page ${pageNum}`, pageW - margin, h - 32, { align: 'right' });
        doc.setFontSize(7);
        doc.text('Keep this document for your records.', margin, h - 20);
      }
    });

    /* -------- Save -------- */
    const safeTitle = (formData.title || 'response')
      .replace(/[^a-z0-9]+/gi, '_').toLowerCase().slice(0, 40) || 'response';
    const stamp = new Date().toISOString().slice(0,10);
    doc.save(`${safeTitle}_${lastSubmission.responseId.slice(0,8)}_${stamp}.pdf`);
    toast('PDF receipt downloaded');
  } catch (err){
    console.error(err);
    toast('PDF generation failed: ' + err.message, 'error');
  } finally {
    $('#pdfLoading').classList.remove('show');
    btn.disabled = false;
    btn.innerHTML = origHTML;
  }
}
</script>
</body>
</html>
