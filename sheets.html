<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSAS Spreadsheet — OVPSAS Forms</title>
<link rel="icon" href="https://wxyzofficial.sirv.com/SSU/ssu.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --light-blue:#DCEEFF; --primary:#4A90E2; --primary-600:#3a7bc8; --primary-700:#2d64a8;
  --dark-blue:#173B63; --accent:#FFD54F; --soft-yellow:#FFF4BF; --white:#FFFFFF;
  --bg:#F5F9FE; --bg-2:#EEF4FC; --text:#1E2A3A; --text2:#64748B;
  --border:#DCE5EF; --border-2:#E8EFF7;
  --success:#198754; --error:#DC3545; --warn:#B45309;
  --shadow-xs:0 1px 2px rgba(23,59,99,.06);
  --shadow-sm:0 2px 8px rgba(23,59,99,.06);
  --shadow:0 6px 20px rgba(23,59,99,.08);
  --shadow-lg:0 16px 40px rgba(23,59,99,.14);
  --row-h:42px; --row-h-compact:32px; --head-h:60px;
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 600px at 0% -10%, rgba(74,144,226,.08), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(255,213,79,.06), transparent 55%);
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cdd9e6;border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#aebfd4}

.app{display:flex;flex-direction:column;height:100vh}

/* ============ HEADER ============ */
.header{
  position:relative;
  background:linear-gradient(135deg, rgba(255,255,255,.92), rgba(245,249,254,.88));
  backdrop-filter:blur(20px) saturate(1.4); -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--border);
  padding:14px 26px; display:flex; justify-content:space-between; align-items:center;
  gap:16px; flex-wrap:wrap; z-index:30;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset, var(--shadow-xs);
}
.header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg, var(--primary) 0%, var(--accent) 40%, var(--primary) 80%);
  opacity:.55;
}
.header .left{display:flex;align-items:center;gap:16px;min-width:0;flex:1}
.logo-ring{
  position:relative;width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(from 200deg, var(--primary), var(--accent), var(--primary));
  padding:2px; box-shadow:0 4px 14px rgba(74,144,226,.28);
}
.logo-ring img{width:100%;height:100%;border-radius:50%;border:2px solid #fff;object-fit:cover;display:block}
.header .meta{min-width:0}
.breadcrumb{font-size:.72rem;color:var(--text2);margin-bottom:4px;font-weight:500;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.breadcrumb a{color:var(--primary);font-weight:600;transition:color .15s}
.breadcrumb a:hover{color:var(--primary-700)}
.breadcrumb i{font-size:.55rem;margin:0 6px;color:#b8c6d6}
.header h1{
  font-size:1.16rem;font-weight:800;color:var(--dark-blue);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px;
  display:flex;align-items:center;gap:10px;letter-spacing:-.01em;
}
.header h1 i{color:var(--primary);font-size:1rem}
.header .stats{font-size:.75rem;color:var(--text2);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.stat-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(220,238,255,.5);border:1px solid rgba(74,144,226,.18);
  padding:3px 10px;border-radius:99px;font-weight:600;color:var(--dark-blue);
}
.stat-chip i{color:var(--primary);font-size:.7rem}
.stat-chip b{color:var(--primary);font-weight:800}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(25,135,84,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,135,84,.5)}70%{box-shadow:0 0 0 8px rgba(25,135,84,0)}100%{box-shadow:0 0 0 0 rgba(25,135,84,0)}}
.header .right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:11px;font-weight:600;font-size:.83rem;
  transition:all .2s var(--ease);white-space:nowrap;position:relative;
  border:1px solid transparent;
}
.btn i{font-size:.85em}
.btn-primary{
  background:linear-gradient(135deg, var(--primary), var(--primary-600));
  color:#fff; box-shadow:0 4px 14px rgba(74,144,226,.35), 0 1px 0 rgba(255,255,255,.3) inset;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(74,144,226,.42)}
.btn-primary:active{transform:translateY(0)}
.btn-accent{
  background:linear-gradient(135deg, #FFE080, var(--accent));
  color:var(--dark-blue);
  box-shadow:0 4px 14px rgba(255,213,79,.4), 0 1px 0 rgba(255,255,255,.5) inset;
}
.btn-accent:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,213,79,.5)}
.btn-ghost{
  background:rgba(255,255,255,.7);border:1px solid var(--border);color:var(--dark-blue);
  backdrop-filter:blur(8px);
}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);background:#fff;box-shadow:var(--shadow-sm)}
.btn-danger{background:linear-gradient(135deg,#e04550,var(--error));color:#fff;box-shadow:0 4px 14px rgba(220,53,69,.32)}
.btn-danger:hover{transform:translateY(-1px)}
.btn-sm{padding:6px 11px;font-size:.78rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text2);transition:all .18s var(--ease);
}
.icon-btn:hover{background:var(--light-blue);color:var(--primary);transform:scale(1.05)}
.icon-btn.danger:hover{background:#fde8ea;color:var(--error)}

/* menu */
.menu-wrap{position:relative}
.menu{
  position:absolute;top:calc(100% + 8px);right:0;
  background:#fff;border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-lg);min-width:240px;padding:7px;
  display:none;z-index:60;transform-origin:top right;
}
.menu.show{display:block;animation:pop .18s var(--ease)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.menu button{
  display:flex;width:100%;align-items:center;gap:11px;padding:10px 13px;
  border-radius:9px;font-size:.85rem;color:var(--text);text-align:left;
  font-weight:500;transition:all .15s;
}
.menu button:hover{background:var(--light-blue);color:var(--primary-700);transform:translateX(2px)}
.menu button i{width:18px;text-align:center;color:var(--primary);font-size:.95rem}
.menu .divider{height:1px;background:var(--border);margin:5px 8px}

/* ============ STATS STRIP ============ */
.stats-strip{
  display:none;align-items:stretch;gap:12px;padding:14px 26px 0;flex-wrap:wrap;
}
.stats-strip.show{display:flex;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.kpi{
  flex:1;min-width:150px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:14px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-xs);transition:all .2s var(--ease);
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:rgba(74,144,226,.3)}
.kpi .k-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;
}
.kpi.total .k-icon{background:linear-gradient(135deg,var(--light-blue),#c3e0ff);color:var(--primary)}
.kpi.showing .k-icon{background:linear-gradient(135deg,#e3f5ea,#c8ecd6);color:var(--success)}
.kpi.dupes .k-icon{background:linear-gradient(135deg,#fde8ea,#fbccd1);color:var(--error)}
.kpi.sync .k-icon{background:linear-gradient(135deg,#fff4bf,#ffe98a);color:#8a6d00}
.kpi .k-body{min-width:0}
.kpi .k-label{font-size:.7rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.kpi .k-value{font-size:1.15rem;font-weight:800;color:var(--dark-blue);line-height:1.2;margin-top:1px}
.kpi .k-value small{font-size:.75rem;font-weight:600;color:var(--text2)}

/* ============ DIAGNOSTIC BANNER ============ */
.diag-banner{
  display:none;margin:14px 26px 0;
  background:linear-gradient(135deg,#FFF7E0,#FFF1C2);
  border:1px solid #F3D577;border-radius:12px;padding:12px 16px;
  font-size:.85rem;color:#7A5A00;align-items:flex-start;gap:11px;
  box-shadow:var(--shadow-xs);line-height:1.5;
}
.diag-banner.show{display:flex}
.diag-banner i{font-size:1.1rem;color:var(--warn);margin-top:2px;flex-shrink:0}
.diag-banner b{color:#5C4400}
.diag-banner code{background:rgba(255,255,255,.6);padding:1px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:.8em}

/* ============ TOOLBAR ============ */
.toolbar{
  display:none;padding:14px 26px 0;gap:10px;align-items:center;flex-wrap:wrap;
}
.toolbar.show{display:flex;animation:fade .3s var(--ease)}
.toolbar-inner{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:14px;
  padding:8px;box-shadow:var(--shadow-sm);width:100%;
}
.search{position:relative;flex:1;min-width:200px;max-width:400px}
.search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:.82rem;pointer-events:none;transition:color .2s}
.search input{
  width:100%;padding:10px 14px 10px 38px;border:1.5px solid transparent;border-radius:10px;
  font-size:.85rem;outline:none;transition:all .2s var(--ease);background:var(--bg);
}
.search input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(74,144,226,.12)}
.search:focus-within i{color:var(--primary)}
.toolbar select{
  padding:9px 32px 9px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.82rem;outline:none;background:#fff;color:var(--text);cursor:pointer;
  transition:all .2s;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%2364748B' d='M0 0l5 6 5-6z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.toolbar select:hover{border-color:#c1d4e8}
.toolbar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.12)}
.toolbar input.filter-input{
  padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.82rem;outline:none;width:150px;transition:all .2s;background:#fff;
}
.toolbar input.filter-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,144,226,.12)}
.seg{
  display:inline-flex;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:2px;
}
.seg button{
  padding:6px 12px;border-radius:7px;font-size:.78rem;font-weight:600;
  color:var(--text2);transition:all .15s;display:inline-flex;align-items:center;gap:5px;
}
.seg button.active{background:#fff;color:var(--primary);box-shadow:var(--shadow-xs)}
.seg button:hover:not(.active){color:var(--dark-blue)}
.toolbar .divider{width:1px;height:22px;background:var(--border);flex-shrink:0}
.toolbar .spacer{flex:1}
.dup-active{
  background:linear-gradient(135deg,#ffe5e8,#fbccd1)!important;
  border-color:#f5b8be!important;color:var(--error)!important;font-weight:700;
}

/* ============ FORMULA BAR ============ */
.formula-bar{
  display:none;margin:14px 26px 0;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:12px;
  padding:7px 12px;align-items:center;gap:12px;font-size:.82rem;
  box-shadow:var(--shadow-xs);flex-wrap:wrap;
}
.formula-bar.show{display:flex;animation:fade .25s var(--ease)}
.cell-ref{
  min-width:64px;color:#fff;font-weight:800;font-family:'JetBrains Mono',monospace;
  background:linear-gradient(135deg,var(--primary),var(--primary-600));
  padding:5px 12px;border-radius:8px;text-align:center;font-size:.78rem;
  box-shadow:0 2px 6px rgba(74,144,226,.28);letter-spacing:.02em;
}
.cell-val{flex:1;color:var(--text2);padding:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:.8rem}
.cell-val.filled{color:var(--text);font-weight:500}

/* ============ GRID ============ */
.grid-wrap{
  flex:1;overflow:auto;position:relative;margin:14px 26px 26px;
  background:#fff;border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-sm);
  will-change:scroll-position;contain:strict;
}
.grid{display:inline-block;min-width:100%;font-size:.84rem;position:relative}
.grid-header{position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.grid-row{
  display:flex;border-bottom:1px solid var(--border-2);position:absolute;left:0;right:0;
  contain:layout paint style;will-change:transform;transition:background .12s;
}
.grid-row:not(.header-row):hover{background:#F7FAFF}
.grid-row:not(.header-row):nth-child(2n){background:rgba(245,249,254,.55)}
.grid-row:not(.header-row):nth-child(2n):hover{background:#EFF6FF}
.grid-row.header-row{position:static;font-weight:600;background:linear-gradient(180deg,#EAF3FF,#DCEEFF)}
.grid-cell{
  display:flex;align-items:center;padding:8px 12px;border-right:1px solid var(--border-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 0 auto;
  position:relative;contain:layout paint style;transition:background .12s;
}
.grid-cell.corner{
  position:sticky;left:0;top:0;z-index:12;
  background:linear-gradient(180deg,#DCEEFF,#c9e2ff);
  width:80px;min-width:80px;justify-content:center;font-weight:700;
  color:var(--dark-blue);border-right:2px solid #b8d4f0;
}
.grid-cell.row-num{
  position:sticky;left:0;z-index:8;
  background:linear-gradient(180deg,#F0F7FF,#DCEEFF);
  width:80px;min-width:80px;justify-content:center;
  color:var(--dark-blue);font-weight:700;font-size:.78rem;
  border-right:2px solid #c3dcf3;cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.grid-cell.row-num:hover{background:var(--light-blue)}
.grid-cell.col-letter{
  justify-content:center;background:transparent;color:var(--dark-blue);
  font-size:.72rem;font-weight:800;min-height:26px;letter-spacing:.05em;
  border-bottom:1px solid rgba(74,144,226,.15);
}
.grid-cell.col-title{
  background:transparent;color:var(--dark-blue);font-size:.8rem;font-weight:700;
  white-space:normal;line-height:1.3;padding:8px 12px;overflow:hidden;
  display:flex;align-items:center;border-right:1px solid rgba(74,144,226,.12);
}
.grid-cell.col-title .inner{
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.grid-cell.col-title.orphan{background:rgba(255,247,224,.7);color:#7A5A00}
.grid-cell.data-cell{cursor:cell;font-variant-numeric:tabular-nums}
.grid-cell.data-cell:hover{background:rgba(220,238,255,.55)}
.grid-cell.selected{
  background:var(--soft-yellow)!important;
  outline:2px solid var(--primary);outline-offset:-2px;z-index:5;
  box-shadow:0 0 0 4px rgba(74,144,226,.08);
}
.grid-cell.row-selected{background:rgba(255,244,191,.6)!important}
.grid-cell.duplicate-cell{
  background:linear-gradient(135deg,#FFF0F0,#ffe0e3)!important;
  color:#B02A37;font-weight:700;
}
.grid-cell.duplicate-cell::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--error);border-radius:0 2px 2px 0;
}
.grid-cell.duplicate-cell.selected{background:var(--soft-yellow)!important;outline:2px solid var(--error);outline-offset:-2px}

/* inline editor */
.inline-editor{
  position:absolute;inset:0;width:100%;height:100%;
  padding:8px 12px;border:2px solid var(--primary);border-radius:0;
  font-family:inherit;font-size:.84rem;background:#fff;outline:none;z-index:20;
  box-shadow:0 0 0 4px rgba(74,144,226,.15), 0 6px 20px rgba(23,59,99,.15);
}
select.inline-editor{appearance:none;cursor:pointer}

/* row action */
.row-action-btn{
  display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;
  color:var(--text2);background:#fff;box-shadow:var(--shadow-xs);z-index:2;
  transition:all .15s;
}
.grid-row:hover .row-action-btn{display:flex}
.row-action-btn:hover{color:var(--error);background:#fde8ea;transform:translateY(-50%) scale(1.1)}

/* loading / empty */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--text2);gap:16px}
.spinner-lg{
  width:44px;height:44px;border:3px solid var(--light-blue);
  border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;
  box-shadow:0 0 0 6px rgba(74,144,226,.08);
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:70px 20px;color:var(--text2);display:flex;flex-direction:column;align-items:center}
.empty i{font-size:3.2rem;color:#c5d7e8;margin-bottom:18px}
.empty h3{color:var(--dark-blue);font-size:1.15rem;margin-bottom:8px;font-weight:700}
.empty p{font-size:.9rem;margin-bottom:20px}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(23,59,99,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
  animation:fadeIn .2s;overflow-y:auto;
}
.modal-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:18px;max-width:660px;width:100%;max-height:88vh;
  box-shadow:0 24px 60px rgba(23,59,99,.28);
  animation:pop .25s var(--ease);display:flex;flex-direction:column;
  border:1px solid rgba(255,255,255,.5);overflow:hidden;
}
.modal-head{
  padding:20px 24px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#F8FBFF,#EEF5FD);position:relative;
}
.modal-head::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary));
  opacity:.4;
}
.modal-head h3{font-size:1.05rem;color:var(--dark-blue);display:flex;align-items:center;gap:10px;font-weight:700}
.modal-head h3 i{color:var(--primary)}
.modal-body{padding:22px 24px;overflow-y:auto}
.modal-foot{
  padding:14px 24px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;
  background:linear-gradient(180deg,#fff,#F8FBFF);
}
.modal.confirm{max-width:420px;text-align:center}
.modal.confirm .modal-body{padding-top:32px}
.modal.confirm .m-icon{
  width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
}
.modal.confirm.danger .m-icon{background:linear-gradient(135deg,#fde8ea,#fbc8cf);color:var(--error);box-shadow:0 8px 20px rgba(220,53,69,.18)}
.modal.confirm.info .m-icon{background:linear-gradient(135deg,var(--light-blue),#bfdeff);color:var(--primary);box-shadow:0 8px 20px rgba(74,144,226,.18)}
.modal.confirm p{color:var(--text2);font-size:.92rem;line-height:1.55}

.detail-row{display:flex;flex-direction:column;gap:5px;padding:13px 0;border-bottom:1px solid var(--border-2)}
.detail-row:last-child{border-bottom:none}
.detail-row .q{font-size:.8rem;font-weight:700;color:var(--dark-blue);text-transform:uppercase;letter-spacing:.03em}
.detail-row .a{font-size:.92rem;color:var(--text);line-height:1.6;word-break:break-word;white-space:pre-wrap}
.detail-row .a.empty-answer{color:var(--text2);font-style:italic}
.detail-meta{
  background:linear-gradient(135deg,#F8FBFF,#EEF5FD);
  border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:18px;font-size:.85rem;
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
.detail-meta b{color:var(--dark-blue);display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:700}
.detail-meta span{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:.78rem;word-break:break-all}

/* ---- EDIT RESPONSE FORM ---- */
.edit-grid{display:flex;flex-direction:column;gap:14px}
.edit-field{display:flex;flex-direction:column;gap:6px}
.edit-field label{font-size:.78rem;font-weight:700;color:var(--dark-blue);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.edit-field label .req{color:var(--error)}
.edit-field label .type-badge{
  font-size:.62rem;font-weight:600;text-transform:none;letter-spacing:0;
  background:var(--light-blue);color:var(--primary-700);border-radius:6px;
  padding:1px 7px;margin-left:auto;
}
.edit-field input[type=text],
.edit-field input[type=number],
.edit-field input[type=email],
.edit-field textarea,
.edit-field select{
  width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.88rem;outline:none;transition:all .2s var(--ease);background:#fff;color:var(--text);
}
.edit-field input:focus,.edit-field textarea:focus,.edit-field select:focus{
  border-color:var(--primary);box-shadow:0 0 0 4px rgba(74,144,226,.12);
}
.edit-field textarea{resize:vertical;min-height:72px;line-height:1.5}
.edit-field select{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%2364748B' d='M0 0l5 6 5-6z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;
}
.checkbox-group,.radio-group{display:flex;flex-direction:column;gap:7px;padding:4px 0}
.checkbox-group label,.radio-group label{
  display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--text);
  text-transform:none;letter-spacing:0;font-weight:500;cursor:pointer;
  padding:7px 11px;border:1.5px solid var(--border);border-radius:9px;transition:all .15s;
}
.checkbox-group label:hover,.radio-group label:hover{border-color:var(--primary);background:rgba(220,238,255,.35)}
.checkbox-group label:has(input:checked),.radio-group label:has(input:checked){
  border-color:var(--primary);background:rgba(220,238,255,.55);font-weight:600;
}
.checkbox-group input,.radio-group input{accent-color:var(--primary);width:16px;height:16px;cursor:pointer}
.edit-orphan-note{
  font-size:.78rem;color:#7A5A00;background:rgba(255,247,224,.7);
  border:1px solid #F3D577;border-radius:10px;padding:9px 12px;line-height:1.45;
}
.edit-unsaved-note{
  font-size:.8rem;color:var(--text2);display:flex;align-items:center;gap:7px;
  padding:4px 0;
}
.edit-unsaved-note i{color:var(--warn)}

/* toast */
.toast-wrap{position:fixed;bottom:26px;right:26px;display:flex;flex-direction:column;gap:10px;z-index:300}
.toast{
  background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(23,59,99,.18);
  padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:.9rem;
  min-width:260px;animation:slideIn .3s var(--ease);border:1px solid var(--border);
  border-left:4px solid var(--primary);font-weight:500;
}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--error)}
.toast i{font-size:1.1rem}
.toast.success i{color:var(--success)}
.toast.error i{color:var(--error)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* form selector */
.form-select{max-width:820px;margin:40px auto;padding:0 20px}
.form-select h2{color:var(--dark-blue);font-size:1.5rem;margin-bottom:8px;font-weight:800;letter-spacing:-.01em}
.form-select > p{color:var(--text2);margin-bottom:26px}
.form-select .list{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.form-select .item{
  padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-bottom:1px solid var(--border-2);cursor:pointer;transition:all .18s var(--ease);flex-wrap:wrap;
}
.form-select .item:last-child{border-bottom:none}
.form-select .item:hover{background:linear-gradient(90deg,#F8FBFF,#EEF5FD);padding-left:26px}
.form-select .item b{color:var(--dark-blue);font-size:.95rem;font-weight:700}
.form-select .item small{color:var(--text2);font-size:.78rem;display:block;margin-top:4px}
.form-select .item small i{color:var(--primary);margin-right:4px}

@media(max-width:820px){
  .header{padding:12px 16px}
  .header h1{max-width:220px;font-size:1rem}
  .header .stats{display:none}
  .stats-strip,.toolbar,.diag-banner{padding-left:16px;padding-right:16px}

  .toolbar-inner{padding:6px}
  .toolbar .divider{display:none}
}
@media(max-width:520px){
  .kpi{min-width:100%}
  .header .right .btn span{display:none}
}

<body>

<div class="app" id="app">
  <!-- HEADER -->
  <div class="header">
    <div class="left">
      <div class="logo-ring">
        <img src="https://wxyzofficial.sirv.com/SSU/ssu.jpg" alt="SSU">
      </div>
      <div class="meta">
        <div class="breadcrumb">
          <a href="admin.html">Dashboard</a> <i class="fa-solid fa-chevron-right"></i>
          <a href="admin.html" onclick="event.preventDefault();history.back()">Forms</a> <i class="fa-solid fa-chevron-right"></i>
          <span id="crumbForm">Spreadsheet</span>
        </div>
        <h1 id="formTitle"><i class="fa-solid fa-table"></i> Loading…</h1>
        <div class="stats">
          <span class="stat-chip"><i class="fa-solid fa-inbox"></i> <b id="rowCount">0</b> responses</span>

          <span class="stat-chip"><span class="live-dot"></span> Live</span>

      </div>
    </div>
    <div class="right">
      <button class="btn btn-ghost" onclick="refreshData()"><i class="fa-solid fa-rotate"></i> <span>Refresh</span></button>
      <div class="menu-wrap">
        <button class="btn btn-accent" id="exportBtn"><i class="fa-solid fa-file-export"></i> <span>Export</span> <i class="fa-solid fa-caret-down" style="font-size:.7rem"></i></button>
        <div class="menu" id="exportMenu">
          <button id="exportXlsx"><i class="fa-solid fa-file-excel"></i> Export as .xlsx</button>
          <button id="exportPdf"><i class="fa-solid fa-file-pdf"></i> Export as PDF (Landscape)</button>
          <div class="divider"></div>
          <button id="exportCsv"><i class="fa-solid fa-file-csv"></i> Export as .csv (raw)</button>
        </div>
      </div>
      <a class="btn btn-ghost" href="admin.html"><i class="fa-solid fa-arrow-left"></i> <span>Dashboard</span></a>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-strip" id="statsStrip">
    <div class="kpi total">
      <div class="k-icon"><i class="fa-solid fa-database"></i></div>
      <div class="k-body">

    <div class="kpi showing">
      <div class="k-icon"><i class="fa-solid fa-eye"></i></div>
      <div class="k-body">
        <div class="k-label">Showing</div>
        <div class="k-value" id="kpiShowing">0 <small>of 0</small></div>
      </div>

    <div class="kpi dupes">
      <div class="k-icon"><i class="fa-solid fa-clone"></i></div>

      </div>

  <!-- DIAGNOSTIC BANNER -->
  <div class="diag-banner" id="diagBanner">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <div id="diagText"></div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <div class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search responses…">
      </div>
      <div class="divider"></div>
      <div class="seg" role="group" aria-label="Sort direction">
        <button id="sortAsc" title="Sort ascending"><i class="fa-solid fa-arrow-up-short-wide"></i> Asc</button>
        <button id="sortDesc" title="Sort descending"><i class="fa-solid fa-arrow-down-wide-short"></i> Desc</button>
      </div>
      <select id="sortColumn" title="Sort column"><option value="">Sort by…</option></select>
      <div class="divider"></div>
      <select id="filterColumn" title="Filter column"><option value="">Filter by…</option></select>
      <input type="text" class="filter-input" id="filterValue" placeholder="Filter value">
      <button class="btn btn-ghost btn-sm" id="clearFilters" title="Clear filters"><i class="fa-solid fa-filter-circle-xmark"></i></button>
      <button class="btn btn-ghost btn-sm" id="duplicatesBtn" title="Show duplicate values"><i class="fa-solid fa-clone"></i> Duplicates</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="densityBtn" title="Toggle row density"><i class="fa-solid fa-bars-staggered"></i> Density</button>
    </div>
  </div>

  <!-- FORMULA BAR -->
  <div class="formula-bar" id="formulaBar">
    <div class="cell-ref" id="cellRef">—</div>
    <div class="cell-val" id="cellVal">Select a cell to view its full value</div>
  </div>

  <!-- GRID -->
  <div class="grid-wrap" id="gridWrap">
    <div class="loading-wrap"><div class="spinner-lg"></div><div>Loading spreadsheet…</div></div>
  </div>

<!-- GENERIC MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head"><h3 id="modalTitle"><i class="fa-solid fa-circle-info"></i> <span>Title</span></h3>
      <button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal confirm danger" id="confirmBox">
    <div class="modal-body">
      <div class="m-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h3 id="confirmTitle" style="color:var(--dark-blue);margin-bottom:8px">Confirm</h3>
      <p id="confirmMsg">Are you sure?</p>
    </div>
    <div class="modal-foot" style="justify-content:center;border-top:none;padding-top:0">
      <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, onSnapshot, updateDoc, deleteDoc, where }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo5TKy65vg27n9Dkuh_PDnNT2byHndEY0",
  authDomain: "forms-a9b1c.firebaseapp.com",
  projectId: "forms-a9b1c",
  storageBucket: "forms-a9b1c.firebasestorage.app",
  messagingSenderId: "1076879732619",
  appId: "1:1076879732619:web:89ba4135332ac30805898e",
  measurementId: "G-88TF54KBKR"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------------- State ---------------- */
let currentUser = null;
let formData = null;
let formId = null;
let allResponses = [];
let filteredResponses = [];
let compact = false;
let selectedCell = null;
let selectedRowId = null;
let unsubscribeSnapshot = null;
let sortColumnDir = -1;
let duplicatesOnly = false;
let duplicateColumn = null;
let duplicateValues = new Set();
let exportInProgress = false;

/* Unified column model */
let columns = [];

const VIRTUAL_BUFFER = 6;
const ROW_HEIGHT_COMPACT = 32;
const ROW_HEIGHT_COMFORTABLE = 42;
let rowHeight = ROW_HEIGHT_COMFORTABLE;
let scrollRaf = null;

let dataVersion = 0;
let lastRenderedVersion = -1;
let lastFilterSignature = '';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

/* ---------------- Helpers ---------------- */
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':'fa-circle-exclamation'}"></i><span></span>`;
  el.querySelector('span').textContent = msg;
  $('#toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function fmtDate(ts){
  if (!ts) return '—';
  try {
    let d;
    if (ts.toDate) d = ts.toDate();
    else if (ts.seconds) d = new Date(ts.seconds * 1000);
    else if (typeof ts.toMillis === 'function') d = new Date(ts.toMillis());
    else d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('en-PH', { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch { return '—'; }
}

function tsMillis(ts){
  if (!ts) return 0;
  if (ts.seconds) return ts.seconds * 1000;
  if (typeof ts.toMillis === 'function') return ts.toMillis();
  if (ts.toDate) return ts.toDate().getTime();
  const n = new Date(ts).getTime();
  return isNaN(n) ? 0 : n;
}

function colLetter(i){
  let s = '';
  while (i >= 0){ s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; }
  return s;
}

function formatAnswer(v){
  if (v === null || v === undefined || v === '') return '';
  if (Array.isArray(v)) return v.join(', ');
  if (typeof v === 'object') { try { return JSON.stringify(v); } catch { return String(v); } }
  return String(v);
}

function prepareResponse(r){
  const answers = r.answers || {};
  const parts = [r.id, fmtDate(r.submittedAt)];
  Object.keys(answers).forEach(k => {
    parts.push(k);
    const v = answers[k];
    if (Array.isArray(v)) parts.push(v.join(' '));
    else parts.push(String(v ?? ''));
  });
  r._hay = parts.join(' ').toLowerCase();
  return r;
}

function discoverColumns(){
  const declared = new Set((formData.questions || []).map(q => q.id));
  const orphans = new Set();
  allResponses.forEach(r => {
    Object.keys(r.answers || {}).forEach(k => {
      if (declared.has(k)) return;
      const v = r.answers[k];
      if (v === '' || v == null) return;
      if (Array.isArray(v) && v.length === 0) return;
      orphans.add(k);
    });
  });

  columns = [
    { id:'__id', title:'Submission ID', orphan:false },
    { id:'__submittedAt', title:'Submitted At', orphan:false },
    ...(formData.questions || []).map((q, i) => ({
      id: q.id, title: q.title || `Question ${i+1}`, orphan:false
    })),
    ...[...orphans].map(id => ({
      id, title:`Old Q · ${id.length > 16 ? id.slice(0, 14) + '…' : id}`, orphan:true
    }))
  ];
}

/* ---------------- Modal helpers ---------------- */
function openModal(title, bodyHTML, footHTML){
  $('#modalTitle').querySelector('span').textContent = title;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalFoot').innerHTML = footHTML || '<button class="btn btn-ghost" onclick="closeModal()">Close</button>';
  $('#modalOverlay').classList.add('show');
}
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
window.closeModal = closeModal;

function confirmDialog({title,msg,type='danger',okText='Confirm'}){
  return new Promise(resolve => {
    const box = $('#confirmBox');
    box.className = 'modal confirm ' + type;
    $('#confirmTitle').textContent = title;
    $('#confirmMsg').textContent = msg;
    const ok = $('#confirmOk');
    ok.className = 'btn ' + (type==='danger'?'btn-danger':'btn-primary');
    ok.textContent = okText;
    box.querySelector('.m-icon').innerHTML = type==='danger'
      ? '<i class="fa-solid fa-triangle-exclamation"></i>'
      : '<i class="fa-solid fa-circle-info"></i>';
    $('#confirmOverlay').classList.add('show');

    const cleanup = () => {
      $('#confirmOverlay').classList.remove('show');
      ok.removeEventListener('click', onOk);
      $('#confirmCancel').removeEventListener('click', onCancel);
    };
    const onOk = () => { cleanup(); resolve(true); };
    const onCancel = () => { cleanup(); resolve(false); };
    ok.addEventListener('click', onOk);
    $('#confirmCancel').addEventListener('click', onCancel);
  });
}

/* ---------------- Auth ---------------- */
const params = new URLSearchParams(location.search);
formId = params.get('id');

onAuthStateChanged(auth, async (user) => {
  if (!user || user.isAnonymous){ window.location.href = 'login.html'; return; }
  try {
    const snap = await getDoc(doc(db, 'admins', user.uid));
    if (!snap.exists() || snap.data().active !== true){ await signOut(auth); window.location.href = 'login.html'; return; }
  } catch { await signOut(auth); window.location.href = 'login.html'; return; }
  currentUser = user;
  if (formId) await loadForm();
  else renderFormSelector();
});

/* ---------------- Load form ---------------- */
async function loadForm(){
  try {
    const snap = await getDoc(doc(db, 'forms', formId));
    if (!snap.exists()){
      $('#gridWrap').innerHTML = `<div class="empty"><i class="fa-solid fa-file-circle-xmark"></i>
        <h3>Form Not Found</h3><p>The form you are looking for does not exist.</p>
        <a class="btn btn-primary" href="admin.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a></div>`;
      return;
    }
    formData = { id:snap.id, ...snap.data() };
    if (formData.ownerUid && formData.ownerUid !== currentUser.uid){
      $('#gridWrap').innerHTML = `<div class="empty"><i class="fa-solid fa-lock"></i>
        <h3>Access Denied</h3><p>You do not have permission to view these responses.</p>
        <a class="btn btn-primary" href="admin.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a></div>`;
      return;
    }
    $('#formTitle').innerHTML = `<i class="fa-solid fa-table"></i> ${escapeHtml(formData.title||'Untitled Form')}`;
    $('#crumbForm').textContent = formData.title || 'Spreadsheet';
    document.title = `${formData.title || 'Spreadsheet'} — OVPSAS Forms`;
    $('#toolbar').classList.add('show');
    $('#formulaBar').classList.add('show');
    $('#statsStrip').classList.add('show');

    $('#searchInput').value = '';
    $('#filterColumn').value = '';
    $('#filterValue').value = '';
    $('#sortColumn').value = '';
    duplicatesOnly = false; duplicateColumn = null; duplicateValues = new Set();
    $('#duplicatesBtn').classList.remove('dup-active');
    setSegActive('');
    dataVersion = 0;
    lastRenderedVersion = -1;
    lastFilterSignature = '';

    loadResponsesRealtime();
  } catch(e){
    console.error(e);
    $('#gridWrap').innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>
      <h3>Connection Error</h3><p>Could not load data. Please refresh.</p>
      <button class="btn btn-primary" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> Retry</button></div>`;
  }
}

function refreshColumnDropdowns(){
  const sortSel = $('#sortColumn');
  const filterSel = $('#filterColumn');
  const list = columns.map(c => `<option value="${c.id}">${escapeHtml(c.title)}${c.orphan?' ⚠️':''}</option>`).join('');
  const prevSort = sortSel.value;
  const prevFilter = filterSel.value;
  sortSel.innerHTML = '<option value="">Sort by…</option>' + list;
  filterSel.innerHTML = '<option value="">Filter by…</option>' + list;
  if ([...sortSel.options].some(o => o.value === prevSort)) sortSel.value = prevSort;
  if ([...filterSel.options].some(o => o.value === prevFilter)) filterSel.value = prevFilter;
}

/* ---------------- Real-time responses ---------------- */
function loadResponsesRealtime(){
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  $('#gridWrap').innerHTML = `<div class="loading-wrap"><div class="spinner-lg"></div><div>Connecting to live data…</div></div>`;

  const respCol = collection(db, 'forms', formId, 'responses');
  const q = query(respCol);

  unsubscribeSnapshot = onSnapshot(q, (snap) => {
    const next = snap.docs.map(d => prepareResponse({ id: d.id, ...d.data() }));
    next.sort((a, b) => tsMillis(b.submittedAt) - tsMillis(a.submittedAt));

    allResponses = next;
    discoverColumns();
    refreshColumnDropdowns();

    dataVersion++;

    const now = new Date().toLocaleTimeString('en-PH', {hour:'2-digit',minute:'2-digit'});
    $('#lastUpdated').textContent = now;
    $('#kpiSync').textContent = now;
    $('#rowCount').textContent = allResponses.length;
    $('#kpiTotal').textContent = allResponses.length;

    checkDiagnostics();
    applyFilters();
  }, (error) => {
    console.error(error);
    $('#gridWrap').innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>
      <h3>Failed to Load</h3><p>${escapeHtml(error.message)}</p>
      <button class="btn btn-primary" onclick="refreshData()"><i class="fa-solid fa-rotate"></i> Retry</button></div>`;
  });
}

function checkDiagnostics(){
  const banner = $('#diagBanner');
  const text = $('#diagText');
  if (!allResponses.length){ banner.classList.remove('show'); return; }

  const emptyAnswers = allResponses.filter(r => !r.answers || Object.keys(r.answers).length === 0).length;
  const missingTs = allResponses.filter(r => !r.submittedAt).length;
  const orphanCount = columns.filter(c => c.orphan).length;

  const msgs = [];
  if (emptyAnswers > 0)
    msgs.push(`<b>${emptyAnswers}</b> response(s) have <code>answers: {}</code> — their data was lost at write time.`);
  if (missingTs > 0)
    msgs.push(`<b>${missingTs}</b> response(s) have no <code>submittedAt</code> — they still appear, but won't sort chronologically.`);
  if (orphanCount > 0)
    msgs.push(`<b>${orphanCount}</b> extra column(s) found from <code>old question IDs</code> — shown with ⚠️.`);

  if (msgs.length){
    text.innerHTML = msgs.join('<br>');
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function updateKpis(){
  $('#kpiTotal').textContent = allResponses.length;
  $('#kpiShowing').innerHTML = `${filteredResponses.length} <small>of ${allResponses.length}</small>`;
  const dupCount = duplicatesOnly && duplicateColumn
    ? filteredResponses.filter(r => {
        const v = getColumnValue(r, duplicateColumn).trim().toLowerCase();
        return v && duplicateValues.has(v);
      }).length
    : 0;
  $('#kpiDupes').textContent = dupCount;
}

function refreshData(){ applyFilters(); toast('Data refreshed'); }
window.refreshData = refreshData;

/* ---------------- Column helpers ---------------- */
function getColumnValue(r, col){
  if (col === '__id') return r.id;
  if (col === '__submittedAt') return fmtDate(r.submittedAt);
  return formatAnswer(r.answers?.[col]);
}

function buildDuplicateSet(col){
  const counts = new Map();
  allResponses.forEach(r => {
    const v = getColumnValue(r, col).trim().toLowerCase();
    if (!v) return;
    counts.set(v, (counts.get(v) || 0) + 1);
  });
  const set = new Set();
  counts.forEach((n, v) => { if (n > 1) set.add(v); });
  return set;
}

/* ---------------- Filter / sort ---------------- */
function applyFilters(){
  const term = ($('#searchInput').value || '').toLowerCase().trim();
  const filterCol = $('#filterColumn').value;
  const filterVal = ($('#filterValue').value || '').toLowerCase().trim();
  const sortCol = $('#sortColumn').value;

  const signature = `${term}|${filterCol}|${filterVal}|${duplicatesOnly}|${duplicateColumn}|${sortCol}|${sortColumnDir}|v${dataVersion}`;

  if (signature === lastFilterSignature) {
    return;
  }
  lastFilterSignature = signature;

  filteredResponses = allResponses.filter(r => {
    if (term && !r._hay.includes(term)) return false;
    if (filterCol && filterVal){
      const s = getColumnValue(r, filterCol);
      if (!s.toLowerCase().includes(filterVal)) return false;
    }
    return true;
  });

  if (duplicatesOnly && duplicateColumn){
    duplicateValues = buildDuplicateSet(duplicateColumn);
    filteredResponses = filteredResponses.filter(r => {
      const v = getColumnValue(r, duplicateColumn).trim().toLowerCase();
      return v && duplicateValues.has(v);
    });
  } else {
    duplicateValues = new Set();
  }

  if (sortCol){
    const sortDir = sortColumnDir;
    filteredResponses.sort((a,b) => {
      let va, vb;
      if (sortCol === '__id'){ va = a.id; vb = b.id; }
      else if (sortCol === '__submittedAt'){ va = tsMillis(a.submittedAt); vb = tsMillis(b.submittedAt); }
      else { va = a.answers?.[sortCol]; vb = b.answers?.[sortCol]; }
      if (Array.isArray(va)) va = va.join(', ');
      if (Array.isArray(vb)) vb = vb.join(', ');
      if (typeof va === 'number' && typeof vb === 'number') return sortDir * (va - vb);
      return sortDir * String(va ?? '').localeCompare(String(vb ?? ''));
    });
  } else {
    filteredResponses.sort((a,b) => tsMillis(b.submittedAt) - tsMillis(a.submittedAt));
  }

  lastRenderedVersion = dataVersion;
  renderGrid();
  updateKpis();
  $('#rowCount').textContent = allResponses.length;
}

$('#sortAsc').addEventListener('click', () => {
  sortColumnDir = 1;
  if(!$('#sortColumn').value) $('#sortColumn').value = '__submittedAt';
  setSegActive('sortAsc'); applyFilters();
});
$('#sortDesc').addEventListener('click', () => {

  if(!$('#sortColumn').value) $('#sortColumn').value = '__submittedAt';
  setSegActive('sortDesc'); applyFilters();
});
function setSegActive(id){

  $('#sortDesc').classList.toggle('active', id === 'sortDesc');
}
$('#sortColumn').addEventListener('change', () => { setSegActive(sortColumnDir===1?'sortAsc':'sortDesc'); applyFilters(); });
$('#searchInput').addEventListener('input', debounce(applyFilters, 260));
$('#filterColumn').addEventListener('change', applyFilters);
$('#filterValue').addEventListener('input', debounce(applyFilters, 280));
$('#clearFilters').addEventListener('click', () => {

});
$('#densityBtn').addEventListener('click', () => {

});

/* ---------------- Duplicates finder ---------------- */
$('#duplicatesBtn').addEventListener('click', () => {
  if (duplicatesOnly) {
    duplicatesOnly = false; duplicateColumn = null; duplicateValues = new Set();
    $('#duplicatesBtn').classList.remove('dup-active');
    applyFilters();
    toast('Duplicate filter cleared');
    return;
  }

  let defaultCol = '__submittedAt';
  const guess = columns.find(c => !c.orphan && /e-?mail|email/i.test(c.title || ''));
  if (guess) defaultCol = guess.id;

  const optionsHTML = columns.map(c => `<option value="${c.id}" ${c.id===defaultCol?'selected':''}>${escapeHtml(c.title)}${c.orphan?' ⚠️':''}</option>`).join('');
  openModal(
    'Find Duplicates',
    `<div style="margin-bottom:12px;color:var(--text2);font-size:.88rem">
        Select a column to detect duplicate values. Empty values are ignored.
      </div>
      <select id="dupColumnSelect" style="width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:.88rem;outline:none">
        ${optionsHTML}
      </select>
      <div id="dupPreview" style="margin-top:16px;font-size:.84rem;color:var(--text2);padding:12px;border-radius:10px;background:var(--bg)"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" id="dupApplyBtn"><i class="fa-solid fa-clone"></i> Show Duplicates</button>`
  );

  const preview = () => {
    const col = $('#dupColumnSelect').value;
    const counts = new Map();
    allResponses.forEach(r => {
      const v = getColumnValue(r, col).trim().toLowerCase();
      if (!v) return;
      counts.set(v, (counts.get(v) || 0) + 1);
    });
    const dupGroups = [...counts.entries()].filter(([,n]) => n > 1);
    const dupRows = dupGroups.reduce((s,[,n]) => s + n, 0);
    $('#dupPreview').innerHTML = dupGroups.length
      ? `<i class="fa-solid fa-triangle-exclamation" style="color:var(--error)"></i>
         Found <b>${dupGroups.length}</b> duplicated value(s) affecting <b>${dupRows}</b> response(s).`
      : `<i class="fa-solid fa-circle-check" style="color:var(--success)"></i> No duplicates found in this column.`;
  };
  $('#dupColumnSelect').addEventListener('change', preview);
  preview();

  $('#dupApplyBtn').addEventListener('click', () => {
    duplicateColumn = $('#dupColumnSelect').value;
    duplicatesOnly = true;
    closeModal();
    $('#duplicatesBtn').classList.add('dup-active');
    applyFilters();
    toast('Showing duplicate responses');
  });
});

/* ---------------- Virtualized Grid ---------------- */
let gridState = {
  gridEl: null, bodyEl: null, headerEl: null,
  totalHeight: 0, bodyTopOffset: 0, colWidths: [], colsCount: 0,
  rowPool: new Map()
};

function colWidthFor(col){
  if (col.id === '__id') return 160;
  if (col.id === '__submittedAt') return 180;
  if (col.orphan) return 220;
  return 210;
}

function totalGridWidth(){
  let w = 80;
  gridState.colWidths.forEach(x => w += x);
  return w;
}

function renderGrid(){
  const wrap = $('#gridWrap');
  const cols = columns.length;
  gridState.colsCount = cols;
  gridState.colWidths = columns.map(colWidthFor);
  gridState.rowPool.clear();

  if (!filteredResponses.length){
    const dupActive = duplicatesOnly && duplicateColumn;
    wrap.innerHTML = `<div class="empty"><i class="fa-solid ${dupActive?'fa-clone':'fa-magnifying-glass'}"></i>
      <h3>${dupActive?'No duplicates found':'No matching responses'}</h3>
      <p>${dupActive?'All values in this column are unique.':'Try adjusting your search or filters.'}</p>
      <button class="btn btn-primary" onclick="document.getElementById('clearFilters').click()"><i class="fa-solid fa-filter-circle-xmark"></i> Clear Filters</button></div>`;
    gridState.gridEl = null; gridState.bodyEl = null; gridState.headerEl = null;
    return;
  }

  const prevScrollTop = wrap.scrollTop;
  wrap.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.width = totalGridWidth() + 'px';

  const headerWrap = document.createElement('div');
  headerWrap.className = 'grid-header';

  const letterRow = document.createElement('div');
  letterRow.className = 'grid-row header-row';
  const corner1 = document.createElement('div');
  corner1.className = 'grid-cell corner';
  corner1.innerHTML = '<i class="fa-solid fa-table-cells"></i>';
  letterRow.appendChild(corner1);
  for (let i = 0; i < cols; i++){
    const c = document.createElement('div');
    c.className = 'grid-cell col-letter';
    c.style.width = gridState.colWidths[i] + 'px';
    c.style.minWidth = c.style.width;
    c.textContent = colLetter(i);
    letterRow.appendChild(c);
  }
  headerWrap.appendChild(letterRow);

  const titleRow = document.createElement('div');
  titleRow.className = 'grid-row header-row';
  const corner2 = document.createElement('div');
  corner2.className = 'grid-cell corner';
  corner2.innerHTML = `<span style="flex:1">#</span>`;
  titleRow.appendChild(corner2);

  columns.forEach((col, i) => {
    const c = document.createElement('div');
    c.className = 'grid-cell col-title' + (col.orphan ? ' orphan' : '');
    c.style.width = gridState.colWidths[i] + 'px';
    c.style.minWidth = c.style.width;
    c.title = col.title + (col.orphan ? ' (from an old question — values still shown)' : '');
    const inner = document.createElement('div');
    inner.className = 'inner';
    inner.textContent = col.title;
    c.appendChild(inner);
    titleRow.appendChild(c);
  });
  headerWrap.appendChild(titleRow);
  grid.appendChild(headerWrap);

  const body = document.createElement('div');
  body.className = 'grid-body';
  body.style.position = 'relative';
  body.style.height = (filteredResponses.length * rowHeight) + 'px';
  grid.appendChild(body);

  gridState.gridEl = grid;
  gridState.bodyEl = body;
  gridState.headerEl = headerWrap;
  gridState.totalHeight = filteredResponses.length * rowHeight;
  gridState.bodyTopOffset = headerWrap.offsetHeight;

  wrap.appendChild(grid);
  wrap.scrollTop = prevScrollTop;

  updateVirtualRows();

  if (!wrap._virtualBound){
    wrap.addEventListener('scroll', () => {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => {
        updateVirtualRows();
        scrollRaf = null;
      });
    }, { passive: true });
    wrap._virtualBound = true;
  }

  if (!wrap._resizeBound){
    window.addEventListener('resize', debounce(() => {
      if (gridState.gridEl) updateVirtualRows(true);
    }, 150));
    wrap._resizeBound = true;
  }
}

function updateVirtualRows(){
  const wrap = $('#gridWrap');
  const body = gridState.bodyEl;
  if (!body || !gridState.gridEl) return;

  const scrollTop = Math.max(0, wrap.scrollTop - (gridState.bodyTopOffset || 0));
  const viewportH = wrap.clientHeight;

  const startIdx = Math.max(0, Math.floor(scrollTop / rowHeight) - VIRTUAL_BUFFER);
  const endIdx = Math.min(filteredResponses.length, Math.ceil((scrollTop + viewportH) / rowHeight) + VIRTUAL_BUFFER);

  const needed = new Set();
  for (let i = startIdx; i < endIdx; i++){
    const r = filteredResponses[i];
    if (r) needed.add(r.id);
  }

  for (const [rid, entry] of gridState.rowPool){
    if (!needed.has(rid)){
      entry.rowEl.remove();
      gridState.rowPool.delete(rid);
    }
  }

  const frag = document.createDocumentFragment();
  let appended = false;
  for (let i = startIdx; i < endIdx; i++){
    const r = filteredResponses[i];
    if (!r || gridState.rowPool.has(r.id)) continue;
    const row = buildRow(r, i);
    row.style.top = (i * rowHeight) + 'px';
    gridState.rowPool.set(r.id, { rowEl: row });
    frag.appendChild(row);
    appended = true;
  }
  if (appended) body.appendChild(frag);
}

function buildRow(r, ri){
  const row = document.createElement('div');
  row.className = 'grid-row';
  row.dataset.rid = r.id;
  row.style.height = rowHeight + 'px';

  const numCell = document.createElement('div');
  numCell.className = 'grid-cell row-num';
  numCell.innerHTML = `${ri + 2} 
    <button class="row-action-btn" data-edit="${r.id}" title="Edit Response" style="right:32px"><i class="fa-solid fa-pen"></i></button>
    <button class="row-action-btn" data-del="${r.id}" title="Delete Response"><i class="fa-solid fa-trash"></i></button>`;
  numCell.addEventListener('click', (e) => {
    if (e.target.closest('[data-del]') || e.target.closest('[data-edit]')) return;
    selectRow(r.id);
  });
  numCell.querySelector('[data-del]').addEventListener('click', (e) => {
    e.stopPropagation();
    deleteResponse(r.id);
  });
  numCell.querySelector('[data-edit]').addEventListener('click', (e) => {
    e.stopPropagation();
    openEditResponse(r.id);
  });
  row.appendChild(numCell);

  columns.forEach((col, ci) => {
    const val = getColumnValue(r, col.id);
    row.appendChild(makeDataCell(val, r, ci, col.id, val, col.orphan));
  });

  return row;
}

function makeDataCell(text, response, colIndex, qid, rawVal, isOrphan){
  const c = document.createElement('div');
  c.className = 'grid-cell data-cell';
  c.style.width = gridState.colWidths[colIndex] + 'px';
  c.style.minWidth = c.style.width;
  c.dataset.rid = response.id;
  c.dataset.qid = qid;
  c.dataset.col = colIndex;
  const display = text === '' ? '' : text;
  c.textContent = display || '—';
  if (display === '') c.style.color = 'var(--text2)';
  c.title = display || '(empty)';

  if (duplicatesOnly && duplicateColumn && qid === duplicateColumn){
    const norm = String(display || '').trim().toLowerCase();
    if (norm && duplicateValues.has(norm)) c.classList.add('duplicate-cell');
  }

  if (!isOrphan && qid !== '__id' && qid !== '__submittedAt') {
    c.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startEditing(c, response, qid);
    });
  }
  c.addEventListener('click', (e) => {
    e.stopPropagation();
    selectCell(c, response, colIndex, qid, rawVal);
  });
  return c;
}

/* ---------------- Inline edit ---------------- */
function startEditing(cell, response, qid){
  if (cell.querySelector('input, select')) return;
  const q = formData.questions.find(x => x.id === qid);
  const currentVal = response.answers?.[qid];
  const cellText = cell.textContent === '—' ? '' : cell.textContent;
  selectCell(cell, response, cell.dataset.col, qid, cellText);

  let editor;
  if (q && (q.type === 'radio' || q.type === 'dropdown')) {
    editor = document.createElement('select');
    editor.className = 'inline-editor';
    editor.innerHTML = `<option value="">(empty)</option>` + (q.options||[]).map(o => `<option value="${escapeHtml(o)}" ${o===currentVal?'selected':''}>${escapeHtml(o)}</option>`).join('');
  } else if (q && q.type === 'checkbox') {
    editor = document.createElement('input');
    editor.type = 'text';
    editor.className = 'inline-editor';
    editor.value = Array.isArray(currentVal) ? currentVal.join(', ') : (currentVal || '');
    editor.placeholder = 'Comma separated for multiple';
  } else {
    editor = document.createElement('input');
    editor.type = q && q.type === 'number' ? 'number' : 'text';
    editor.className = 'inline-editor';
    editor.value = currentVal || '';
  }

  cell.appendChild(editor);
  editor.focus();

  let isCancelled = false;
  const save = async () => {
    if (isCancelled) return;
    let newVal = editor.value.trim();
    if (q && q.type === 'checkbox') {
      newVal = newVal ? newVal.split(',').map(s => s.trim()).filter(Boolean) : [];
    }
    const oldVal = Array.isArray(currentVal) ? currentVal.join(', ') : (currentVal || '');
    const comparableNew = Array.isArray(newVal) ? newVal.join(', ') : String(newVal);
    if (comparableNew !== oldVal) {
      try {
        const respRef = doc(db, 'forms', formId, 'responses', response.id);
        await updateDoc(respRef, { [`answers.${qid}`]: newVal });
        if (!response.answers) response.answers = {};
        response.answers[qid] = newVal;
        prepareResponse(response);
        toast('Response updated');
      } catch (err) {
        console.error(err);
        toast('Failed to update: ' + err.message, 'error');
      }
    }
    editor.remove();
    applyFilters();
  };
  editor.addEventListener('blur', save);
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); editor.blur(); }
    if (e.key === 'Escape') { isCancelled = true; editor.remove(); }
  });
}

async function deleteResponse(rid) {
  const ok = await confirmDialog({
    title: 'Delete Response?',
    msg: 'This will permanently delete this submission. This action cannot be undone.',
    type: 'danger', okText: 'Delete'
  });
  if (!ok) return;
  try {
    await deleteDoc(doc(db, 'forms', formId, 'responses', rid));
    toast('Response deleted');
  } catch (err) {
    console.error(err);
    toast('Failed to delete: ' + err.message, 'error');
  }
}
window.deleteResponse = deleteResponse;

/* ---------------- EDIT RESPONSE (full modal) ---------------- */
function openEditResponse(rid){
  const r = allResponses.find(x => x.id === rid);
  if (!r) { toast('Response not found', 'error'); return; }

  const questions = formData.questions || [];
  const orphans = columns.filter(c => c.orphan);
  const orphanValues = orphans.filter(c => r.answers && r.answers[c.id] != null && r.answers[c.id] !== '');

  const fieldsHTML = questions.map(q => {
    const raw = r.answers?.[q.id];
    const val = Array.isArray(raw) ? raw : (raw == null ? '' : String(raw));
    const reqMark = q.required ? ' <span class="req">*</span>' : '';
    const typeBadge = `<span class="type-badge">${escapeHtml(q.type || 'text')}</span>`;
    const label = `<label>${escapeHtml(q.title || 'Question')}${reqMark}${typeBadge}</label>`;
    let input = '';

    if (q.type === 'radio' || q.type === 'dropdown'){
      const opts = (q.options || []).map(o =>
        `<option value="${escapeHtml(o)}" ${o === val ? 'selected' : ''}>${escapeHtml(o)}</option>`
      ).join('');
      if (q.type === 'dropdown'){
        input = `<select data-qid="${q.id}" data-type="dropdown">
          <option value="">(empty)</option>${opts}
        </select>`;
      } else {
        input = `<div class="radio-group">${(q.options || []).map((o, oi) =>
          `<label><input type="radio" name="radio_${q.id}" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="radio" ${o === val ? 'checked' : ''}> ${escapeHtml(o)}</label>`
        ).join('') || '<span style="color:var(--text2);font-size:.82rem">(no options defined)</span>'}</div>`;
      }
    } else if (q.type === 'checkbox'){
      const selected = Array.isArray(raw) ? raw : (raw ? [raw] : []);
      input = `<div class="checkbox-group">${(q.options || []).map(o =>
        `<label><input type="checkbox" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="checkbox" ${selected.includes(o) ? 'checked' : ''}> ${escapeHtml(o)}</label>`
      ).join('') || '<span style="color:var(--text2);font-size:.82rem">(no options defined)</span>'}</div>`;
    } else if (q.type === 'textarea' || q.type === 'long-text' || q.type === 'paragraph'){
      input = `<textarea data-qid="${q.id}" data-type="textarea" placeholder="Enter answer…">${escapeHtml(val)}</textarea>`;
    } else if (q.type === 'number'){
      input = `<input type="number" data-qid="${q.id}" data-type="number" value="${escapeHtml(val)}" placeholder="Enter number…">`;
    } else if (q.type === 'email'){
      input = `<input type="email" data-qid="${q.id}" data-type="email" value="${escapeHtml(val)}" placeholder="name@example.com">`;
    } else if (q.type === 'date'){
      input = `<input type="text" data-qid="${q.id}" data-type="date" value="${escapeHtml(val)}" placeholder="YYYY-MM-DD">`;
    } else {
      input = `<input type="text" data-qid="${q.id}" data-type="text" value="${escapeHtml(val)}" placeholder="Enter answer…">`;
    }
    return `<div class="edit-field">${label}${input}</div>`;
  }).join('');

  const orphanNote = orphanValues.length
    ? `<div class="edit-orphan-note"><i class="fa-solid fa-triangle-exclamation"></i>
         ${orphanValues.length} answer(s) belong to old/removed questions. They are preserved and can only be edited below.
       </div>`
    : '';

  const orphanFields = orphanValues.map(c => {
    const raw = r.answers[c.id];
    const val = Array.isArray(raw) ? raw.join(', ') : String(raw ?? '');
    return `<div class="edit-field">
      <label style="color:#7A5A00"><i class="fa-solid fa-clock-rotate-left"></i> ${escapeHtml(c.title)} <span class="type-badge" style="background:#fff4bf;color:#7A5A00">old</span></label>
      <input type="text" data-qid="${c.id}" data-type="text" value="${escapeHtml(val)}" placeholder="(empty)">
    </div>`;
  }).join('');

  openModal(
    'Edit Response',
    `<div class="detail-meta" style="grid-template-columns:1fr 1fr;margin-bottom:18px">
       <div><b>Submission ID</b><span>${escapeHtml(r.id)}</span></div>
       <div><b>Submitted At</b><span>${escapeHtml(fmtDate(r.submittedAt))}</span></div>
     </div>
     <div class="edit-unsaved-note"><i class="fa-solid fa-circle-info"></i> All fields are editable. Changes are saved when you click <b>Save Changes</b>.</div>
     ${orphanNote}
     <div class="edit-grid" id="editGrid">
       ${fieldsHTML}
       ${orphanFields}
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" id="saveResponseBtn"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>`
  );

  $('#saveResponseBtn').addEventListener('click', async () => {
    const updates = {};
    const newAnswers = {};

    // Collect updated values from all inputs
    $('#editGrid').querySelectorAll('[data-qid]').forEach(el => {
      const qid = el.dataset.qid;
      const type = el.dataset.type;
      if (type === 'checkbox'){
        // Handled separately below via checkbox groups
        return;
      }
      if (type === 'radio'){
        // Handled separately below via radio groups
        return;
      }
      newAnswers[qid] = el.value.trim();
    });

    // Handle checkbox groups
    const checkboxGroups = new Map();
    $('#editGrid').querySelectorAll('input[type=checkbox][data-qid]').forEach(cb => {
      const qid = cb.dataset.qid;
      if (!checkboxGroups.has(qid)) checkboxGroups.set(qid, []);
      if (cb.checked) checkboxGroups.get(qid).push(cb.value);
    });
    checkboxGroups.forEach((vals, qid) => { newAnswers[qid] = vals; });

    // Handle radio groups
    const radioGroups = new Map();
    $('#editGrid').querySelectorAll('input[type=radio][data-qid]').forEach(rd => {
      const qid = rd.dataset.qid;
      if (rd.checked) radioGroups.set(qid, rd.value);
    });
    radioGroups.forEach((val, qid) => { newAnswers[qid] = val; });

    // Build updates only for changed values
    const orig = r.answers || {};
    for (const qid of Object.keys(newAnswers)){
      const oldRaw = orig[qid];
      const oldVal = Array.isArray(oldRaw) ? oldRaw.join('|||') : String(oldRaw ?? '');
      const newRaw = newAnswers[qid];
      const newVal = Array.isArray(newRaw) ? newRaw.join('|||') : String(newRaw);
      if (oldVal !== newVal){
        updates[`answers.${qid}`] = newRaw;
      }
    }

    if (Object.keys(updates).length === 0){
      toast('No changes to save');
      closeModal();
      return;
    }

    const btn = $('#saveResponseBtn');
    const origHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';

    try {
      const respRef = doc(db, 'forms', formId, 'responses', r.id);
      await updateDoc(respRef, updates);
      // Optimistic local update
      if (!r.answers) r.answers = {};
      Object.keys(newAnswers).forEach(qid => { r.answers[qid] = newAnswers[qid]; });
      prepareResponse(r);
      closeModal();
      toast(`Response updated (${Object.keys(updates).length} field${Object.keys(updates).length > 1 ? 's' : ''})`);
      applyFilters();
    } catch (err) {
      console.error(err);
      toast('Failed to update: ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = origHTML;
    }
  });
}
window.openEditResponse = openEditResponse;

/* ---------------- Selection ---------------- */
function selectCell(cellEl, response, colIndex, qid, val){
  $$('.grid-cell.selected').forEach(el => el.classList.remove('selected'));
  cellEl.classList.add('selected');
  selectedCell = { row: response.id, col: colIndex, qid, val, response };
  $('#cellRef').textContent = colLetter(Number(colIndex)) + (filteredResponses.findIndex(r => r.id === response.id) + 2);

  v.textContent = val || '(empty)';

}

function selectRow(rid){
  $$('.grid-cell.row-selected').forEach(el => el.classList.remove('row-selected'));
  const entry = gridState.rowPool.get(rid);
  if (entry) entry.rowEl.querySelectorAll('.grid-cell').forEach(c => c.classList.add('row-selected'));
  selectedRowId = rid;
  const r = filteredResponses.find(x => x.id === rid);

}

/* ---------------- Response detail ---------------- */
function openResponseDetail(r){
  const questions = formData.questions || [];
  const rows = questions.map(q => {
    const v = formatAnswer(r.answers?.[q.id]);
    return `<div class="detail-row">
      <div class="q">${escapeHtml(q.title || 'Question')}${q.required?' <span style="color:var(--error)">*</span>':''}</div>
      <div class="a ${v?'':'empty-answer'}">${v?escapeHtml(v):'(no answer)'}</div>
    </div>`;
  }).join('');

  const orphanIds = columns.filter(c => c.orphan).map(c => c.id);
  const orphanRows = orphanIds
    .filter(id => r.answers && r.answers[id] != null && r.answers[id] !== '')
    .map(id => {
      const v = formatAnswer(r.answers[id]);
      return `<div class="detail-row">
        <div class="q" style="color:#7A5A00">⚠️ Old question · <code>${escapeHtml(id)}</code></div>
        <div class="a">${escapeHtml(v)}</div>
      </div>`;
    }).join('');

  openModal('Response Details',
    `<div class="detail-meta">
      <div><b>Submission ID</b><span>${escapeHtml(r.id)}</span></div>
      <div><b>Submitted At</b><span>${escapeHtml(fmtDate(r.submittedAt))}</span></div>
      <div><b>Respondent UID</b><span>${escapeHtml(r.respondentUid || '—')}</span></div>
      <div><b>Sync Status</b><span style="color:var(--success)"><i class="fa-solid fa-circle-check"></i> ${escapeHtml(r.syncStatus || 'synced')}</span></div>
    </div>
    ${rows}${orphanRows}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Close</button>
     <button class="btn btn-primary" onclick="closeModal();openEditResponse('${escapeHtml(r.id)}')">
       <i class="fa-solid fa-pen"></i> Edit Response
     </button>`
  );
}

/* ---------------- XLSX Export ---------------- */
$('#exportXlsx').addEventListener('click', () => {
  exportMenu.classList.remove('show');
  exportXlsx();
});

async function exportXlsx(){
  if (exportInProgress) return;
  if (!filteredResponses.length){ toast('Nothing to export', 'error'); return; }

  const title = formData.title || 'Responses';
  const safeTitle = title.replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  const stamp = new Date().toISOString().slice(0,10);

  exportInProgress = true;
  const btn = $('#exportXlsx');
  const origHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating…';

  try {
    const headers = columns.map(c => c.title + (c.orphan ? ' (old)' : ''));
    const rows = filteredResponses.map(r => columns.map(c => getColumnValue(r, c.id)));

    const wb = new ExcelJS.Workbook();
    wb.creator = 'OVPSAS Forms';
    wb.created = new Date();
    const ws = wb.addWorksheet('Responses', { views: [{ state: 'frozen', ySplit: 1 }] });

    const sampleRows = rows.slice(0, 200);
    ws.columns = headers.map((h, i) => {
      let max = String(h).length;
      for (const r of sampleRows){
        const len = String(r[i] ?? '').length;
        if (len > max) max = len;
      }
      let width;
      if (i === 0) width = 26;
      else if (i === 1) width = 22;
      else width = Math.min(Math.max(max + 2, 14), 50);
      return { header: h, key: 'c' + i, width };
    });

    const headerRow = ws.getRow(1);
    headerRow.height = 28;
    headerRow.eachCell((cell, col) => {
      cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: col <= 2 ? 'FF4A90E2' : 'FF173B63' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = {
        top:{style:'thin',color:{argb:'FFDCEEFF'}}, bottom:{style:'thin',color:{argb:'FFDCEEFF'}},
        left:{style:'thin',color:{argb:'FFDCEEFF'}}, right:{style:'thin',color:{argb:'FFDCEEFF'}}
      };
    });

    rows.forEach((row, ri) => {
      const r = ws.addRow(row);
      r.height = 18;
      const isAlt = ri % 2 === 1;
      r.eachCell((cell) => {
        cell.alignment = { vertical: 'middle', wrapText: false };
        cell.font = { size: 10, color: { argb: 'FF243447' } };
        cell.border = {
          top:{style:'thin',color:{argb:'FFDCE5EF'}}, bottom:{style:'thin',color:{argb:'FFDCE5EF'}},
          left:{style:'thin',color:{argb:'FFDCE5EF'}}, right:{style:'thin',color:{argb:'FFDCE5EF'}}
        };
        if (isAlt) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F9FE' } };
      });
    });

    ws.autoFilter = { from:{row:1,column:1}, to:{row:1,column:headers.length} };
    ws.properties.tabColor = { argb: 'FF4A90E2' };

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safeTitle}_responses_${stamp}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`Exported ${filteredResponses.length} responses to .xlsx`);
  } catch (err) {
    console.error(err);
    toast('XLSX export failed: ' + err.message, 'error');
  } finally {
    exportInProgress = false;
    btn.disabled = false;
    btn.innerHTML = origHTML;
  }
}

/* ---------------- PDF Export ---------------- */
$('#exportPdf').addEventListener('click', () => {
  exportMenu.classList.remove('show');
  exportPdf();
});

function exportPdf(){
  if (exportInProgress) return;
  if (!filteredResponses.length){ toast('Nothing to export', 'error'); return; }

  const title = formData.title || 'Responses';
  const safeTitle = title.replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  const stamp = new Date().toISOString().slice(0,10);

  exportInProgress = true;
  const btn = $('#exportPdf');
  const origHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating…';

  setTimeout(() => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
      const pageW = doc.internal.pageSize.getWidth();
      const pageH = doc.internal.pageSize.getHeight();
      const margin = 24;
      const usable = pageW - margin * 2;

      doc.setFillColor(23, 59, 99);
      doc.rect(0, 0, pageW, 44, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      doc.text(title, margin, 28);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.text(`Exported ${new Date().toLocaleString('en-PH')} · ${filteredResponses.length} responses`,
        pageW - margin, 28, { align: 'right' });

      const MAX_LEN = 140;
      const head = [['#', ...columns.map(c => c.title)]];

      const body = filteredResponses.map((r, i) => {
        const arr = [String(i + 1)];
        columns.forEach(c => {
          let v = getColumnValue(r, c.id) || '—';
          if (v.length > MAX_LEN) v = v.slice(0, MAX_LEN - 3) + '…';
          arr.push(v);
        });
        return arr;
      });

      const colStyles = { 0: { cellWidth: 22 } };
      let qW = Math.floor((usable - 22) / Math.max(columns.length, 1));
      if (qW < 36) qW = 36;
      for (let i = 1; i <= columns.length; i++) colStyles[i] = { cellWidth: qW };

      let baseFont = 6.5;
      let cellPad = 3;
      if (22 + qW * columns.length > usable){ baseFont = 5.8; cellPad = 2.2; }

      doc.autoTable({
        head, body, startY: 56,
        margin: { left: margin, right: margin, top: 56, bottom: 30 },
        tableWidth: usable,
        styles: {
          font: 'helvetica', fontSize: baseFont, cellPadding: cellPad,
          overflow: 'linebreak', lineColor: [220, 229, 239], lineWidth: 0.4,
          textColor: [36, 52, 71], valign: 'middle', minCellHeight: 13
        },
        headStyles: {
          fillColor: [74, 144, 226], textColor: 255, fontStyle: 'bold',
          fontSize: baseFont + 0.7, halign: 'left', cellPadding: cellPad + 1.5
        },
        alternateRowStyles: { fillColor: [245, 249, 254] },
        columnStyles: colStyles,
        didDrawPage: () => {
          const pageNum = doc.internal.getNumberOfPages();
          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text(`Page ${pageNum}`, pageW - margin, pageH - 12, { align: 'right' });
          doc.text('OVPSAS Forms', margin, pageH - 12);
        }
      });

      doc.save(`${safeTitle}_responses_${stamp}.pdf`);
      toast(`Exported ${filteredResponses.length} responses to PDF`);
    } catch (err) {
      console.error(err);
      toast('PDF export failed: ' + err.message, 'error');
    } finally {
      exportInProgress = false;
      btn.disabled = false;
      btn.innerHTML = origHTML;
    }
  }, 30);
}

/* ---------------- CSV export ---------------- */
$('#exportCsv').addEventListener('click', () => {
  exportMenu.classList.remove('show');
  exportCsv();
});
function exportCsv(){
  if (!filteredResponses.length){ toast('Nothing to export', 'error'); return; }
  const headers = columns.map(c => c.title + (c.orphan ? ' (old)' : ''));
  const rows = filteredResponses.map(r => columns.map(c => getColumnValue(r, c.id)));
  const csvEscape = (v) => {
    const s = v == null ? '' : String(v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const csv = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeTitle = (formData.title || 'responses').replace(/[^a-z0-9]+/gi, '_').toLowerCase();
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `${safeTitle}_responses_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Exported ${filteredResponses.length} responses to CSV`);
}

async function renderFormSelector(){
  $('#toolbar').classList.remove('show');
  $('#formulaBar').classList.remove('show');
  $('#statsStrip').classList.remove('show');
  $('#diagBanner').classList.remove('show');
  const wrap = $('#gridWrap');
  wrap.innerHTML = `<div class="loading-wrap"><div class="spinner-lg"></div><div>Loading forms…</div></div>`;
  try {
    const q = query(collection(db, 'forms'), where('ownerUid','==',currentUser.uid));
    const snap = await getDocs(q);
    const forms = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    if (!forms.length){
      wrap.innerHTML = `<div class="empty"><i class="fa-solid fa-file-circle-plus"></i>
        <h3>No forms yet</h3><p>Create a form to start collecting responses.</p>
        <a class="btn btn-primary" href="admin.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a></div>`;
      return;
    }
    wrap.innerHTML = `<div class="form-select">
      <h2>Choose a Form</h2>
      <p>Select a form to open its response spreadsheet.</p>
      <div class="list">
        ${forms.map(f => `<div class="item" onclick="location.href='sheets.html?id=${encodeURIComponent(f.id)}'">
          <div><b>${escapeHtml(f.title||'Untitled')}</b>
            <small><i class="fa-solid fa-inbox"></i> ${f.responseCount||0} responses · ${f.status==='published'?'Published':'Draft'}</small></div>
          <i class="fa-solid fa-arrow-right" style="color:var(--primary)"></i>
        </div>`).join('')}
      </div>
    </div>`;
  } catch(e){
    wrap.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>
      <h3>Failed to Load Forms</h3><p>${escapeHtml(e.message)}</p>
      <button class="btn btn-primary" onclick="location.reload()">Retry</button></div>`;
  }
}
